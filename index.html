tab_retina:'Retina',tab_fovea:'Foveea',tab_orb:'Punctul orb',tab_ill:'Iluzii',tab_bil:'Bilanț',tab_quiz:'Test',
r_h:'Un calculator în fundul ochiului',
r_p:['Retina primește imaginea și o trimite creierului. Atinge un strat ca să afli ce face.','Retina nu e un senzor pasiv: este țesut cerebral, care prelucrează imaginea în mai multe tipuri de celule înainte ca ceva să plece spre creier.','Organizare: trei straturi de corpi celulari (ONL, INL, GCL) separate de două straturi plexiforme (OPL, IPL), unde sunt sinapsele. Informația e filtrată în paralel în peste 20 de canale ganglionare.'],
r_hint_h:'Alege un strat',r_hint_p:'Lumina intră de sus. Retina e „inversată”: străbate aproape toate straturile înainte să ajungă la fotoreceptori.',
r_light:'lumină',r_path:'linia punctată: conuri → bipolar → ganglionar → creier',
layers:[
{n:'Fibrele nervului optic',t:['Cablul care duce imaginea spre creier: ~1 milion de fibre.','Sunt axonii celulelor ganglionare; converg spre papila optică și formează nervul optic. Locul unde ies nu are fotoreceptori: punctul orb.','Nervul optic are ~1,0–1,2 milioane de axoni; majoritatea merg la nucleul geniculat lateral (LGN), alții la colicul superior și alte ținte.']},
{n:'Celule ganglionare',t:['Singurele celule care trimit semnalul spre creier, sub formă de impulsuri.','Au câmpuri receptive centru–periferie: răspund la contrast, nu la lumina absolută.','Tipuri principale: M/parasol (mișcare, contrast), P/midget (detaliu fin, roșu–verde), K (albastru–galben). ipRGC cu melanopsină reglează ritmul circadian și reflexul pupilar.']},
{n:'Celule amacrine',t:['Ajută la „înțelegerea” mișcării chiar în ochi.','Peste 30 de tipuri; detectează direcția mișcării și schimbările bruște, modulând semnalul bipolar→ganglionar.','Ex.: celulele starburst generează selectivitatea direcțională a ganglionarelor DS prin inhibiție asimetrică.']},
{n:'Celule bipolare',t:['Fac legătura între fotoreceptori și celulele ganglionare.','Există canale ON (răspund la lumină) și OFF (la întuneric): baza vederii contrastelor în ambele sensuri.','Cca. 12 tipuri; ON folosesc mGluR6, OFF receptori ionotropici de glutamat. Bipolarele midget păstrează rezoluția în fovee (1 con → 1 bipolar → 1 ganglionară).']},
{n:'Celule orizontale',t:['Fac imaginea mai contrastată, accentuând marginile.','Conectează lateral fotoreceptorii vecini și îi inhibă (inhibiție laterală): explică benzile Mach și, în parte, grila Hermann.','Feedback-ul orizontal→con reglează câștigul sinapsei și contribuie la constanța culorii și la adaptarea la lumină.']},
{n:'Fotoreceptori',t:['Captează lumina: ~120 M bastonașe (noapte) și ~6 M conuri (zi și culoare).','Bastonașele văd în lumină slabă, fără culoare; conurile L, M, S dau culoarea și sunt concentrate în fovee. La lumină, fotoreceptorii se hiperpolarizează.','Fototransducție: foton → rodopsină/opsină → transducină → PDE6 scade cGMP → canalele CNG se închid. Un bastonaș poate răspunde la un singur foton.']},
{n:'Epiteliu pigmentar',t:['Absoarbe lumina rătăcită și hrănește fotoreceptorii.','Regenerează pigmentul vizual (retinalul) consumat de lumină.','Fagocitează zilnic vârfurile segmentelor externe; disfuncția sa e implicată în degenerescența maculară legată de vârstă.']}],
f_h:'Simulator de privire',
f_p:['Mută degetul sau mouse-ul pe imagine: acolo privești. Doar centrul e clar; restul e neclar și mai puțin colorat, deși în viață ai impresia că vezi totul limpede.','Foveea (~2° din câmpul vizual) are o densitate enormă de conuri. Spre periferie conurile se răresc și mai mulți fotoreceptori converg spre aceeași celulă ganglionară, deci rezoluția scade rapid.','Densitatea conurilor scade de la ordinul a 150.000–200.000/mm² în fovee la sub 10.000/mm² la ~10° excentricitate. Magnificarea corticală face ca o fracțiune mică din retină să ocupe o mare parte din V1.'],
f_rad:'Rază fovee',f_ill:'Arată iluzia (totul clar)',
f_s1:'Foveea vede detalii.',f_s2:'Periferia ghicește, iar creierul completează.',
f_words:'retină fovee con bastonaș ganglion nerv optic cortex vizual sacadă clipit iluzie context predicție',
o_h:'Punctul orb',
o_p:['În ochi există o zonă „oarbă”, dar nu o vezi: creierul o umple.','Unde nervul optic iese din ochi nu există fotoreceptori; în câmpul vizual apare o „gaură” de cca. 5°×7°.','Se află la ~15° temporal față de fixație, puțin sub orizontală. Umplerea (filling-in) implică activitate în cortexul vizual, nu doar ignorarea golului.'],
o_pos:'Poziția semnului',o_dot:'Punct',o_gap:'Linie întreruptă',o_tex:'Textură',
o_how:'<b>Cum:</b> acoperă ochiul <b>stâng</b>, privește crucea cu ochiul drept, fără să muți privirea. Ține ecranul la ~3–4 ori distanța fizică dintre cruce și semn. Mișcă lent glisorul: semnul dispare. La linie, golul se „închide”; la textură apar dungile.',
i_h:'Iluzii: retina și creierul la lucru',
i_herm:'Grila Hermann',i_mach:'Benzi Mach',i_trox:'Troxler',i_after:'Postimagine',i_flash:'Flash-lag',
l_hw:'Grosime linii',
n_herm:['Apar puncte gri la intersecțiile albe, deși acolo nu e nimic gri.','Explicația clasică: inhibiție laterală în câmpurile receptive centru–periferie. La intersecții, periferia albă inhibă mai mult centrul decât pe un culoar.','Iluzia persistă și cu linii ondulate, ceea ce contrazice explicația pur retiniană (Geier și colab.); se propun și modele corticale.'],
l_mg:'Intensitate inhibiție',mach_lbl:'alb: luminanță reală · portocaliu: răspuns centru–periferie',
n_mach:['Fiecare bandă e de un gri uniform, dar pare mai deschisă lângă vecina mai închisă și invers.','Retina exagerează marginile prin organizarea centru–periferie. Jos: luminanța reală (alb) și răspunsul simulat (portocaliu), cu supra- și subîncărcare la margini.','Modelul este o diferență de gaussiene (σ centru=3 px, σ periferie=9 px). Benzile Mach clasice apar la tranziții în rampă; treptele de aici ilustrează doar răspunsul filtrului.'],
l_start:'Începe',
n_trox:['Fixează punctul negru: după câteva secunde, petele din jur dispar.','Retina adaptează răspunsul la stimuli stabili; neuronii răspund mai ales la schimbare, iar creierul completează cu fundalul.','Efectul e mai puternic în periferie, unde câmpurile receptive sunt mari; microsacadele contracarează parțial adaptarea în condiții normale.'],
c_red:'Roșu',c_green:'Verde',c_blue:'Albastru',c_yellow:'Galben',a_start:'Privește 20 s',a_ph:'Acum privește punctul',
n_after:['Fixează 20 de secunde, apoi privește câmpul alb: vezi culoarea opusă, deși nu există în lume.','Conurile s-au adaptat la culoarea fixată și răspund slab la lumina albă; rămân mai active cele complementare.','Teoria canalelor oponente (Hering): adaptarea apare în conuri și în canalele oponente următoare; unele postimagini persistă cu ochii închiși, deci au și o componentă corticală.'],
l_truth:'Arată alinierea reală',
n_flash:['Privește crucea. Punctul alb clipit pare să rămână în urma celui verde, deși sunt aliniate.','Creierul compensează întârzierea de ~100 ms extrapolând mișcarea obiectului aflat în mișcare, dar nu și pe cel clipit.','Explicații concurente: extrapolare (Nijhawan), diferențe de latență (Whitney), mediere temporală. Efectul arată că percepția „prezentului” este o estimare.'],
b_h:'Bilanț: cât vedem și cât completăm',
b_p:['Percepția vizuală e mai aproape de o „halucinație controlată” (formularea lui Anil Seth): o ipoteză continuă a creierului, corectată de semnalele din retină.','În modelul „predictive coding”, creierul trimite predicții în jos, iar erorile de predicție urcă.','Formulări: Rao & Ballard, Friston. Straturile superioare prezic activitatea celor inferioare; se propagă preponderent eroarea. Modelul rămâne dezbătut ca explicație completă.'],
b_c1:'Compresia: 120 → 1',b_c1n:'≈126 milioane de fotoreceptori → ≈1 milion de fibre în nervul optic. Retina comprimă înainte de transmitere.',

b_concl:'<b>Concluzie.</b> Retina trimite o schiță comprimată, cu margini accentuate și zone lipsă. Creierul construiește scena „clară și continuă” pe care o trăiești. Când intrarea lipsește, construcția continuă singură: la unele persoane cu pierdere gravă a vederii apare sindromul Charles Bonnet, cu imagini vii inexistente.',
b_note:'Cifre aproximative din literatura clasică (ex. Curcio și colab., Jonas și colab., Sherman & Guillery); variază între indivizi. Aplicație educațională, nu instrument de diagnostic.',
q_h:'Test',q_intro:'Zece întrebări despre retină și percepție.',q_of:'Întrebarea',q_next:'Următoarea',q_fin:'Vezi rezultatul',q_again:'Reia testul',q_score:'Scor',q_ok:'Corect!',q_no:'Greșit.',
q_m:['Mai ai de recitit secțiunile.','Bine!','Excelent!'],
Q:[
{q:'Pe ce straturi ajunge lumina prima dată în retină?',o:['Direct pe fotoreceptori','Pe celulele ganglionare și celelalte straturi, înaintea fotoreceptorilor','Pe epiteliul pigmentar','Doar pe celulele bipolare'],a:1,e:'Retina e „inversată”: lumina străbate straturile interne înainte de fotoreceptori.'},
{q:'Aproximativ ce raport există între fotoreceptori și fibrele nervului optic?',o:['1 : 1','~10 : 1','~120 : 1','~1000 : 1'],a:2,e:'≈126 M fotoreceptori față de ≈1 M fibre: retina comprimă informația.'},
{q:'Ce celule realizează inhibiția laterală la nivelul fotoreceptorilor?',o:['Celulele bipolare','Celulele orizontale','Celulele ganglionare','Epiteliul pigmentar'],a:1,e:'Celulele orizontale conectează lateral fotoreceptorii și accentuează contrastul.'},
{q:'De ce există punctul orb?',o:['Cristalinul are un defect','Unde iese nervul optic nu există fotoreceptori','Foveea acoperă zona','Creierul taie o parte din imagine'],a:1,e:'Papila optică nu conține fotoreceptori, deci acolo nu se înregistrează lumina.'},
{q:'Cât din câmpul vizual acoperă vederea foarte clară (fovea)?',o:['~2°','~30°','~90°','Jumătate din câmp'],a:0,e:'Doar ~2°; restul e mult mai puțin detaliat.'},
{q:'Benzile Mach apar în principal datorită…',o:['Reflexiei luminii în ochi','Inhibiției laterale care accentuează marginile','Zgomotului senzorilor','Clipitului'],a:1,e:'Organizarea centru–periferie exagerează contrastul la margini.'},
{q:'Efectul Troxler arată că…',o:['Retina adaptează răspunsul la stimuli stabili','Ochiul vede doar mișcarea','Petele sunt reale și dispar','Conurile se strică'],a:0,e:'Stimulii stabili sunt „uitați”, iar creierul completează cu fundalul.'},
{q:'De ce vezi o postimagine în culoarea complementară?',o:['Imaginea rămâne pe cristalin','Receptorii adaptați răspund slab, iar canalele opuse domină','Ecranul păstrează lumina','Mușchii ochiului obosesc'],a:1,e:'Adaptarea reduce răspunsul la culoarea fixată; apare impresia culorii opuse.'},
{q:'Ce sugerează efectul flash-lag?',o:['Ochiul vede fără întârziere','Creierul extrapolează mișcarea pentru a compensa întârzierea','Obiectele clipite sunt mai rapide','Retina inversează timpul'],a:1,e:'Percepția „prezentului” este o predicție care compensează latența de ~100 ms.'},
{q:'Ce înseamnă „halucinație controlată”?',o:['Că oamenii văd stafii','Percepția e o predicție a creierului, corectată de semnalele senzoriale','Că retina e defectă','Că vederea este aleatoare'],a:1,e:'Creierul generează ipoteza; intrările senzoriale o corectează.'}],

en:{
sub:'How the retina processes light and how much we hallucinate',
lvl_lbl:'Level:',lvl1:'Beginner',lvl2:'Intermediate',lvl3:'Advanced',
tab_retina:'Retina',tab_fovea:'Fovea',tab_orb:'Blind spot',tab_ill:'Illusions',tab_bil:'Summary',tab_quiz:'Quiz',
r_h:'A computer at the back of the eye',
r_p:['The retina receives the image and sends it to the brain. Tap a layer to see what it does.','The retina is not a passive sensor: it is brain tissue that processes the image through several cell types before anything leaves for the brain.','Organisation: three cell-body layers (ONL, INL, GCL) separated by two plexiform layers (OPL, IPL) where the synapses sit. Information is filtered in parallel through 20+ ganglion-cell channels.'],
r_hint_h:'Choose a layer',r_hint_p:'Light enters from the top. The retina is "inverted": light crosses almost every layer before reaching the photoreceptors.',
r_light:'light',r_path:'dotted line: cones → bipolar → ganglion → brain',
layers:[
{n:'Optic nerve fibres',t:['The cable carrying the image to the brain: about 1 million fibres.','They are the axons of ganglion cells; they converge on the optic disc to form the optic nerve. Where they exit there are no photoreceptors: the blind spot.','The optic nerve holds ~1.0–1.2 million axons; most go to the lateral geniculate nucleus (LGN), others to the superior colliculus and other targets.']},
{n:'Ganglion cells',t:['The only cells that send the signal to the brain, as spikes.','They have centre–surround receptive fields: they respond to contrast, not absolute light.','Main types: M/parasol (motion, contrast), P/midget (fine detail, red–green), K (blue–yellow). ipRGCs with melanopsin regulate circadian rhythm and the pupil reflex.']},
{n:'Amacrine cells',t:['They help "understand" motion inside the eye itself.','Over 30 types; they detect motion direction and sudden changes by modulating the bipolar→ganglion signal.','E.g. starburst amacrine cells create direction selectivity in DS ganglion cells through asymmetric inhibition.']},
{n:'Bipolar cells',t:['They link photoreceptors to ganglion cells.','ON channels respond to light and OFF channels to darkness: the basis of contrast vision in both directions.','About 12 types; ON cells use mGluR6, OFF cells ionotropic glutamate receptors. Midget bipolars preserve foveal resolution (1 cone → 1 bipolar → 1 ganglion cell).']},
{n:'Horizontal cells',t:['They sharpen contrast by emphasising edges.','They connect neighbouring photoreceptors sideways and inhibit them (lateral inhibition): this explains Mach bands and, in part, the Hermann grid.','Horizontal→cone feedback tunes synaptic gain and contributes to colour constancy and light adaptation.']},
{n:'Photoreceptors',t:['They catch the light: ~120 M rods (night) and ~6 M cones (day and colour).','Rods work in dim light without colour; L, M, S cones give colour and cluster in the fovea. In light, photoreceptors hyperpolarise.','Phototransduction: photon → rhodopsin/opsin → transducin → PDE6 lowers cGMP → CNG channels close. A rod can respond to a single photon.']},
{n:'Pigment epithelium',t:['It absorbs stray light and feeds the photoreceptors.','It regenerates the visual pigment (retinal) used up by light.','It phagocytoses outer-segment tips daily; its dysfunction is implicated in age-related macular degeneration.']}],
f_h:'Gaze simulator',
f_p:['Move your finger or mouse over the image: that is where you look. Only the centre is sharp; the rest is blurred and less colourful, although in daily life you feel you see everything clearly.','The fovea (~2° of the visual field) has an enormous density of cones. Towards the periphery cones thin out and more photoreceptors converge on the same ganglion cell, so resolution drops fast.','Cone density falls from the order of 150,000–200,000/mm² in the fovea to under 10,000/mm² at ~10° eccentricity. Cortical magnification gives a small part of the retina a large share of V1.'],
f_rad:'Fovea radius',f_ill:'Show the illusion (all sharp)',
f_s1:'The fovea sees detail.',f_s2:'The periphery guesses; the brain fills in.',
f_words:'retina fovea cone rod ganglion nerve optic cortex visual saccade blink illusion context prediction',
o_h:'The blind spot',
o_p:['There is a "blind" zone in the eye, yet you do not see it: the brain fills it in.','Where the optic nerve leaves the eye there are no photoreceptors; a "hole" of about 5°×7° appears in the visual field.','It lies ~15° temporal to fixation, slightly below the horizontal. Filling-in involves visual-cortex activity, not merely ignoring the gap.'],
o_pos:'Mark position',o_dot:'Dot',o_gap:'Broken line',o_tex:'Texture',
o_how:'<b>How:</b> cover your <b>left</b> eye, look at the cross with your right eye without moving your gaze. Hold the screen at ~3–4 times the physical distance between cross and mark. Move the slider slowly: the mark vanishes. With the line, the gap "closes"; with the texture, stripes appear.',
i_h:'Illusions: retina and brain at work',
i_herm:'Hermann grid',i_mach:'Mach bands',i_trox:'Troxler',i_after:'Afterimage',i_flash:'Flash-lag',
l_hw:'Line width',
n_herm:['Grey dots appear at the white intersections, though nothing grey is there.','Classic explanation: lateral inhibition in centre–surround receptive fields. At intersections, the white surround inhibits the centre more than along a corridor.','The illusion persists with wavy lines, which contradicts a purely retinal account (Geier et al.); cortical models have been proposed.'],
l_mg:'Inhibition strength',mach_lbl:'white: real luminance · orange: centre–surround response',
n_mach:['Each band is a uniform grey, yet it looks lighter next to a darker neighbour and vice versa.','The retina exaggerates edges through centre–surround organisation. Below: real luminance (white) and simulated response (orange), with over- and undershoot at edges.','The model is a difference of Gaussians (σ centre=3 px, σ surround=9 px). Classic Mach bands arise at ramp transitions; the steps here only illustrate the filter response.'],
l_start:'Start',
n_trox:['Fixate the black dot: after a few seconds the surrounding blobs vanish.','The retina adapts to stable stimuli; neurons respond mainly to change, and the brain fills in with the background.','The effect is stronger in the periphery, where receptive fields are large; microsaccades partly counteract adaptation under normal conditions.'],
c_red:'Red',c_green:'Green',c_blue:'Blue',c_yellow:'Yellow',a_start:'Stare for 20 s',a_ph:'Now look at the dot',
n_after:['Stare for 20 seconds, then look at the white field: you see the opposite colour, though it does not exist in the world.','The cones adapted to the fixated colour and respond weakly to white light; the complementary ones stay relatively more active.','Opponent-process theory (Hering): adaptation occurs in cones and in downstream opponent channels; some afterimages persist with closed eyes, so a cortical component exists too.'],
l_truth:'Show true alignment',
n_flash:['Look at the cross. The flashed white dot seems to lag behind the green one, though they are aligned.','The brain compensates for the ~100 ms delay by extrapolating the position of the moving object, but not of the flashed one.','Competing explanations: extrapolation (Nijhawan), latency differences (Whitney), temporal averaging. The effect shows that perceiving "the present" is an estimate.'],
b_h:'Summary: how much we see and how much we fill in',
b_p:['Visual perception is closer to a "controlled hallucination" (Anil Seth\'s phrase): a continuous hypothesis by the brain, corrected by signals from the retina.','In the predictive-coding model, the brain sends predictions down and prediction errors travel up.','Formulations: Rao & Ballard, Friston. Higher layers predict lower-layer activity; mostly the error propagates. Whether it fully explains perception remains debated.'],
b_c1:'Compression: 120 → 1',b_c1n:'≈126 million photoreceptors → ≈1 million fibres in the optic nerve. The retina compresses before transmitting.',
b_c2:'How much of the visual field is truly sharp?',b_ang:'Sharp-vision angle:',b_pct_t:'of the visual field (ellipse ≈200°×135°) is in focus at any moment. The rest is approximated or filled in from context.',
s1:'of the retinal surface is fovea, yet a very large share of primary visual cortex is devoted to it.',
s2:'blind spot: a zone with no information, filled in automatically.',
s3:'saccades: vision is suppressed during them and you do not notice the "gaps".',
s4:'blinks: each interrupts the image for ~0.1–0.15 s and the brain "stitches" the scene.',
s5:'delay from retina to awareness; the brain predicts, so you perceive a small extrapolation.',
s6:'roughly this share of LGN synapses come directly from the retina; the rest is feedback (approximate figure).',
b_concl:'<b>Conclusion.</b> The retina sends a compressed sketch with sharpened edges and missing zones. The brain builds the "clear and continuous" scene you experience. When input is missing, the construction carries on by itself: in some people with severe vision loss, Charles Bonnet syndrome produces vivid images that do not exist.',
b_note:'Approximate figures from classic literature (e.g. Curcio et al., Jonas et al., Sherman & Guillery); they vary between individuals. Educational app, not a diagnostic tool.',
q_h:'Quiz',q_intro:'Ten questions about the retina and perception.',q_of:'Question',q_next:'Next',q_fin:'See result',q_again:'Retake quiz',q_score:'Score',q_ok:'Correct!',q_no:'Wrong.',
q_m:['Worth re-reading the sections.','Good!','Excellent!'],
Q:[
{q:'Which layers does light reach first in the retina?',o:['Directly the photoreceptors','The ganglion cells and other layers, before the photoreceptors','The pigment epithelium','Only the bipolar cells'],a:1,e:'The retina is "inverted": light crosses the inner layers before the photoreceptors.'},
{q:'Roughly what ratio exists between photoreceptors and optic nerve fibres?',o:['1 : 1','~10 : 1','~120 : 1','~1000 : 1'],a:2,e:'≈126 M photoreceptors versus ≈1 M fibres: the retina compresses information.'},
{q:'Which cells provide lateral inhibition at the photoreceptor level?',o:['Bipolar cells','Horizontal cells','Ganglion cells','Pigment epithelium'],a:1,e:'Horizontal cells connect photoreceptors sideways and sharpen contrast.'},
{q:'Why does the blind spot exist?',o:['The lens has a flaw','There are no photoreceptors where the optic nerve exits','The fovea covers the area','The brain cuts part of the image'],a:1,e:'The optic disc contains no photoreceptors, so no light is registered there.'},
{q:'How much of the visual field does very sharp vision (fovea) cover?',o:['~2°','~30°','~90°','Half the field'],a:0,e:'Only ~2°; the rest is far less detailed.'},
{q:'Mach bands mainly arise because of…',o:['Light reflecting inside the eye','Lateral inhibition that sharpens edges','Sensor noise','Blinking'],a:1,e:'Centre–surround organisation exaggerates contrast at edges.'},
{q:'The Troxler effect shows that…',o:['The retina adapts to stable stimuli','The eye sees only motion','The blobs are real and disappear','Cones get damaged'],a:0,e:'Stable stimuli are "forgotten" and the brain fills in with the background.'},
{q:'Why do you see an afterimage in the complementary colour?',o:['The image stays on the lens','Adapted receptors respond weakly, so opposing channels dominate','The screen keeps emitting light','Eye muscles tire'],a:1,e:'Adaptation lowers the response to the fixated colour; the opposite colour seems to appear.'},
{q:'What does the flash-lag effect suggest?',o:['The eye sees with zero delay','The brain extrapolates motion to compensate for delay','Flashed objects are faster','The retina reverses time'],a:1,e:'Perceiving "the present" is a prediction that compensates for ~100 ms of latency.'},
{q:'What does "controlled hallucination" mean?',o:['That people see ghosts','Perception is a brain prediction corrected by sensory signals','That the retina is defective','That vision is random'],a:1,e:'The brain generates the hypothesis; sensory input corrects it.'}],
