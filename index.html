T.fr={"sub":"Comment la rétine traite l’image et à quel point nous hallucinons","lvl_lbl":"Niveau :","lvl1":"Débutant","lvl2":"Moyen","lvl3":"Avancé","tab_retina":"Rétine","tab_fovea":"Fovéa","tab_orb":"Tache aveugle","tab_ill":"Illusions","tab_bil":"Bilan","tab_quiz":"Quiz","r_h":"Un ordinateur au fond de l’œil","r_p":["La rétine reçoit l’image et l’envoie au cerveau. Touchez une couche pour voir ce qu’elle fait.","La rétine n’est pas un capteur passif : c’est du tissu cérébral, qui traite l’image dans plusieurs types de cellules avant que quoi que ce soit ne parte vers le cerveau.","Organisation : trois couches de corps cellulaires (ONL, INL, GCL) séparées par deux couches plexiformes (OPL, IPL), où se trouvent les synapses. L’information est filtrée en parallèle dans plus de 20 canaux ganglionnaires."],"r_hint_h":"Choisissez une couche","r_hint_p":"La lumière entre par le haut. La rétine est « inversée » : la lumière traverse presque toutes les couches avant d’atteindre les photorécepteurs.","r_light":"lumière","r_path":"ligne pointillée : cônes → bipolaire → ganglionnaire → cerveau","layers":[{"n":"Fibres du nerf optique","t":["Le câble qui porte l’image vers le cerveau : ~1 million de fibres.","Ce sont les axones des cellules ganglionnaires ; ils convergent vers la papille optique et forment le nerf optique. L’endroit où ils sortent n’a pas de photorécepteurs : la tache aveugle.","Le nerf optique compte ~1,0–1,2 million d’axones ; la plupart vont au noyau géniculé latéral (NGL), d’autres au colliculus supérieur et à d’autres cibles."]},{"n":"Cellules ganglionnaires","t":["Les seules cellules qui envoient le signal au cerveau, sous forme d’impulsions.","Elles ont des champs récepteurs centre–périphérie : elles répondent au contraste, pas à la lumière absolue.","Types principaux : M/parasol (mouvement, contraste), P/midget (détail fin, rouge–vert), K (bleu–jaune). Les ipRGC à mélanopsine règlent le rythme circadien et le réflexe pupillaire."]},{"n":"Cellules amacrines","t":["Elles aident à « comprendre » le mouvement dès l’œil.","Plus de 30 types ; elles détectent la direction du mouvement et les changements brusques, en modulant le signal bipolaire→ganglionnaire.","Ex. : les cellules starburst génèrent la sélectivité directionnelle des ganglionnaires DS par inhibition asymétrique."]},{"n":"Cellules bipolaires","t":["Elles font le lien entre les photorécepteurs et les cellules ganglionnaires.","Il existe des canaux ON (répondent à la lumière) et OFF (à l’obscurité) : la base de la vision des contrastes dans les deux sens.","Environ 12 types ; les ON utilisent mGluR6, les OFF des récepteurs ionotropiques du glutamate. Les bipolaires midget préservent la résolution dans la fovéa (1 cône → 1 bipolaire → 1 ganglionnaire)."]},{"n":"Cellules horizontales","t":["Elles rendent l’image plus contrastée en accentuant les bords.","Elles relient latéralement les photorécepteurs voisins et les inhibent (inhibition latérale) : cela explique les bandes de Mach et, en partie, la grille de Hermann.","Le rétrocontrôle horizontal→cône règle le gain de la synapse et contribue à la constance des couleurs et à l’adaptation à la lumière."]},{"n":"Photorécepteurs","t":["Ils captent la lumière : ~120 M de bâtonnets (nuit) et ~6 M de cônes (jour et couleur).","Les bâtonnets voient en lumière faible, sans couleur ; les cônes L, M, S donnent la couleur et sont concentrés dans la fovéa. À la lumière, les photorécepteurs s’hyperpolarisent.","Phototransduction : photon → rhodopsine/opsine → transducine → PDE6 baisse le GMPc → les canaux CNG se ferment. Un bâtonnet peut répondre à un seul photon."]},{"n":"Épithélium pigmentaire","t":["Il absorbe la lumière parasite et nourrit les photorécepteurs.","Il régénère le pigment visuel (le rétinal) consommé par la lumière.","Il phagocyte chaque jour l’extrémité des segments externes ; son dysfonctionnement est impliqué dans la dégénérescence maculaire liée à l’âge."]}],"f_h":"Simulateur de regard","f_p":["Déplacez le doigt ou la souris sur l’image : c’est là que vous regardez. Seul le centre est net ; le reste est flou et moins coloré, alors que dans la vie vous avez l’impression de tout voir clairement.","La fovéa (~2° du champ visuel) a une densité énorme de cônes. Vers la périphérie, les cônes se raréfient et plusieurs photorécepteurs convergent vers la même cellule ganglionnaire, donc la résolution chute vite.","La densité des cônes passe de l’ordre de 150 000–200 000/mm² dans la fovéa à moins de 10 000/mm² à ~10° d’excentricité. Le grossissement cortical fait qu’une petite fraction de la rétine occupe une grande part de V1."],"f_rad":"Rayon de la fovéa","f_ill":"Montrer l’illusion (tout net)","f_s1":"La fovéa voit les détails.","f_s2":"La périphérie devine, et le cerveau complète.","f_words":"rétine fovéa cône bâtonnet ganglion nerf optique cortex visuel saccade clignement illusion contexte prédiction","o_h":"Tache aveugle","o_p":["Dans l’œil il y a une zone « aveugle », mais vous ne la voyez pas : le cerveau la remplit.","À l’endroit où le nerf optique sort de l’œil, il n’y a pas de photorécepteurs ; dans le champ visuel apparaît un « trou » d’environ 5°×7°.","Elle se situe à ~15° du côté temporal par rapport à la fixation, un peu sous l’horizontale. Le remplissage (filling-in) implique une activité dans le cortex visuel, pas seulement l’ignorance du vide."],"o_pos":"Position du repère","o_dot":"Point","o_gap":"Ligne interrompue","o_tex":"Texture","o_how":"<b>Comment :</b> couvrez l’œil <b>gauche</b>, regardez la croix avec l’œil droit sans bouger le regard. Tenez l’écran à ~3–4 fois la distance physique entre la croix et le repère. Déplacez lentement le curseur : le repère disparaît. Pour la ligne, le trou se « referme » ; pour la texture, les rayures apparaissent.","i_h":"Illusions : la rétine et le cerveau à l’œuvre","i_herm":"Grille de Hermann","i_mach":"Bandes de Mach","i_trox":"Troxler","i_after":"Image rémanente","i_flash":"Flash-lag","l_hw":"Épaisseur des lignes","n_herm":["Des points gris apparaissent aux intersections blanches, alors qu’il n’y a rien de gris à cet endroit.","Explication classique : inhibition latérale dans les champs récepteurs centre–périphérie. Aux intersections, la périphérie blanche inhibe davantage le centre que dans un couloir.","L’illusion persiste avec des lignes ondulées, ce qui contredit l’explication purement rétinienne (Geier et coll.) ; des modèles corticaux sont aussi proposés."],"l_mg":"Intensité de l’inhibition","mach_lbl":"blanc : luminance réelle · orange : réponse centre–périphérie","n_mach":["Chaque bande est d’un gris uniforme, mais paraît plus claire près de sa voisine plus sombre, et inversement.","La rétine exagère les bords grâce à l’organisation centre–périphérie. En bas : la luminance réelle (blanc) et la réponse simulée (orange), avec surcharge et sous-charge aux bords.","Le modèle est une différence de gaussiennes (σ centre=3 px, σ périphérie=9 px). Les bandes de Mach classiques apparaissent aux transitions en rampe ; les marches d’ici illustrent seulement la réponse du filtre."],"l_start":"Démarrer","n_trox":["Fixez le point noir : après quelques secondes, les taches autour disparaissent.","La rétine adapte sa réponse aux stimuli stables ; les neurones répondent surtout au changement, et le cerveau complète avec l’arrière-plan.","L’effet est plus fort en périphérie, où les champs récepteurs sont grands ; les microsaccades contrecarrent en partie l’adaptation dans des conditions normales."],"c_red":"Rouge","c_green":"Vert","c_blue":"Bleu","c_yellow":"Jaune","a_start":"Regarder 20 s","a_ph":"Regardez maintenant le point","n_after":["Fixez pendant 20 secondes, puis regardez le champ blanc : vous voyez la couleur opposée, alors qu’elle n’existe pas dans le monde.","Les cônes se sont adaptés à la couleur fixée et répondent faiblement à la lumière blanche ; les complémentaires restent plus actifs.","Théorie des canaux opposants (Hering) : l’adaptation apparaît dans les cônes et dans les canaux opposants suivants ; certaines images rémanentes persistent les yeux fermés, elles ont donc aussi une composante corticale."],"l_truth":"Montrer l’alignement réel","n_flash":["Regardez la croix. Le point blanc clignotant semble rester en arrière du vert, alors qu’ils sont alignés.","Le cerveau compense le retard d’environ 100 ms en extrapolant le mouvement de l’objet en mouvement, mais pas celui de l’objet clignotant.","Explications concurrentes : extrapolation (Nijhawan), différences de latence (Whitney), moyennage temporel. L’effet montre que la perception du « présent » est une estimation."],"b_h":"Bilan : ce que nous voyons et ce que nous complétons","b_p":["La perception visuelle est plus proche d’une « hallucination contrôlée » (formule d’Anil Seth) : une hypothèse continue du cerveau, corrigée par les signaux de la rétine.","Dans le modèle du « codage prédictif », le cerveau envoie des prédictions vers le bas, et les erreurs de prédiction remontent.","Formulations : Rao & Ballard, Friston. Les couches supérieures prédisent l’activité des couches inférieures ; c’est surtout l’erreur qui se propage. Le modèle reste débattu comme explication complète."],"b_c1":"Compression : 120 → 1","b_c1n":"≈126 millions de photorécepteurs → ≈1 million de fibres dans le nerf optique. La rétine comprime avant de transmettre.","b_c2":"Quelle part du champ visuel est vraiment nette ?","b_ang":"Angle de vision nette :","b_pct_t":"du champ visuel (ellipse ≈200°×135°) est net à un instant donné. Le reste est approximé ou complété à partir du contexte.","s1":"de la surface de la rétine est la fovéa, mais une très grande part du cortex visuel primaire lui est consacrée.","s2":"tache aveugle : une zone sans information, complétée automatiquement.","s3":"saccades : la vision est supprimée pendant celles-ci, et vous ne remarquez pas les « trous ».","s4":"clignements : chacun interrompt l’image ~0,1–0,15 s, et le cerveau « recolle » la scène.","s5":"retard rétine → conscience ; le cerveau prédit, donc vous percevez une petite extrapolation.","s6":"c’est à peu près la part des synapses du noyau géniculé latéral qui vient directement de la rétine ; le reste est du rétrocontrôle (chiffre indicatif).","b_concl":"<b>Conclusion.</b> La rétine envoie une esquisse compressée, aux bords accentués et avec des zones manquantes. Le cerveau construit la scène « nette et continue » que vous vivez. Quand l’entrée manque, la construction continue d’elle-même : chez certaines personnes ayant une perte de vision grave apparaît le syndrome de Charles Bonnet, avec des images vives inexistantes.","b_note":"Chiffres approximatifs issus de la littérature classique (p. ex. Curcio et coll., Jonas et coll., Sherman & Guillery) ; ils varient selon les individus. Application éducative, pas un outil de diagnostic.","q_h":"Quiz","q_intro":"Dix questions sur la rétine et la perception.","q_of":"Question","q_next":"Suivante","q_fin":"Voir le résultat","q_again":"Refaire le quiz","q_score":"Score","q_ok":"Correct !","q_no":"Faux.","q_m":["Il vous reste des sections à relire.","Bien !","Excellent !"],"Q":[{"q":"Par quelles couches la lumière entre-t-elle d’abord dans la rétine ?","o":["Directement sur les photorécepteurs","Sur les cellules ganglionnaires et les autres couches, avant les photorécepteurs","Sur l’épithélium pigmentaire","Uniquement sur les cellules bipolaires"],"a":1,"e":"La rétine est « inversée » : la lumière traverse les couches internes avant les photorécepteurs."},{"q":"Quel est approximativement le rapport entre photorécepteurs et fibres du nerf optique ?","o":["1 : 1","~10 : 1","~120 : 1","~1000 : 1"],"a":2,"e":"≈126 M de photorécepteurs pour ≈1 M de fibres : la rétine comprime l’information."},{"q":"Quelles cellules assurent l’inhibition latérale au niveau des photorécepteurs ?","o":["Les cellules bipolaires","Les cellules horizontales","Les cellules ganglionnaires","L’épithélium pigmentaire"],"a":1,"e":"Les cellules horizontales relient latéralement les photorécepteurs et accentuent le contraste."},{"q":"Pourquoi la tache aveugle existe-t-elle ?","o":["Le cristallin a un défaut","Là où sort le nerf optique, il n’y a pas de photorécepteurs","La fovéa couvre la zone","Le cerveau coupe une partie de l’image"],"a":1,"e":"La papille optique ne contient pas de photorécepteurs, donc la lumière n’y est pas enregistrée."},{"q":"Quelle part du champ visuel couvre la vision très nette (fovéa) ?","o":["~2°","~30°","~90°","La moitié du champ"],"a":0,"e":"Seulement ~2° ; le reste est beaucoup moins détaillé."},{"q":"Les bandes de Mach apparaissent principalement à cause de…","o":["La réflexion de la lumière dans l’œil","L’inhibition latérale qui accentue les bords","Le bruit des capteurs","Le clignement"],"a":1,"e":"L’organisation centre–périphérie exagère le contraste aux bords."},{"q":"L’effet Troxler montre que…","o":["La rétine adapte sa réponse aux stimuli stables","L’œil ne voit que le mouvement","Les taches sont réelles et disparaissent","Les cônes se détériorent"],"a":0,"e":"Les stimuli stables sont « oubliés », et le cerveau complète avec l’arrière-plan."},{"q":"Pourquoi voit-on une image rémanente de la couleur complémentaire ?","o":["L’image reste sur le cristallin","Les récepteurs adaptés répondent faiblement et les canaux opposés dominent","L’écran garde la lumière","Les muscles de l’œil se fatiguent"],"a":1,"e":"L’adaptation réduit la réponse à la couleur fixée ; l’impression de la couleur opposée apparaît."},{"q":"Que suggère l’effet flash-lag ?","o":["L’œil voit sans retard","Le cerveau extrapole le mouvement pour compenser le retard","Les objets clignotants sont plus rapides","La rétine inverse le temps"],"a":1,"e":"La perception du « présent » est une prédiction qui compense la latence d’environ 100 ms."},{"q":"Que signifie « hallucination contrôlée » ?","o":["Que les gens voient des fantômes","La perception est une prédiction du cerveau, corrigée par les signaux sensoriels","Que la rétine est défectueuse","Que la vision est aléatoire"],"a":1,"e":"Le cerveau génère l’hypothèse ; les entrées sensorielles la corrigent."}],"foot":"MIRAJ · application HTML à fichier unique, hors ligne, sans frontières · trade-free"};
T.de={"sub":"Wie die Netzhaut verarbeitet und wie stark wir halluzinieren","lvl_lbl":"Stufe:","lvl1":"Einsteiger","lvl2":"Mittel","lvl3":"Fortgeschritten","tab_retina":"Netzhaut","tab_fovea":"Fovea","tab_orb":"Blinder Fleck","tab_ill":"Illusionen","tab_bil":"Bilanz","tab_quiz":"Quiz","r_h":"Ein Computer im Augenhintergrund","r_p":["Die Netzhaut empfängt das Bild und schickt es ans Gehirn. Tippe auf eine Schicht, um zu sehen, was sie tut.","Die Netzhaut ist kein passiver Sensor: Sie ist Hirngewebe und verarbeitet das Bild in mehreren Zelltypen, bevor etwas zum Gehirn weitergeht.","Aufbau: drei Schichten von Zellkörpern (ONL, INL, GCL), getrennt durch zwei plexiforme Schichten (OPL, IPL), in denen die Synapsen liegen. Die Information wird parallel in über 20 Ganglienkanälen gefiltert."],"r_hint_h":"Wähle eine Schicht","r_hint_p":"Das Licht tritt von oben ein. Die Netzhaut ist „invertiert“: Das Licht durchquert fast alle Schichten, bevor es die Photorezeptoren erreicht.","r_light":"Licht","r_path":"gepunktete Linie: Zapfen → Bipolarzelle → Ganglienzelle → Gehirn","layers":[{"n":"Sehnervenfasern","t":["Das Kabel, das das Bild zum Gehirn trägt: ~1 Million Fasern.","Es sind die Axone der Ganglienzellen; sie laufen an der Papille zusammen und bilden den Sehnerv. Dort, wo sie austreten, gibt es keine Photorezeptoren: der blinde Fleck.","Der Sehnerv hat ~1,0–1,2 Millionen Axone; die meisten gehen zum seitlichen Kniehöcker (LGN), andere zum Colliculus superior und zu weiteren Zielen."]},{"n":"Ganglienzellen","t":["Die einzigen Zellen, die das Signal als Impulse zum Gehirn senden.","Sie haben Zentrum-Umfeld-Rezeptionsfelder: Sie reagieren auf Kontrast, nicht auf absolutes Licht.","Haupttypen: M/Parasol (Bewegung, Kontrast), P/Midget (feines Detail, Rot–Grün), K (Blau–Gelb). ipRGC mit Melanopsin steuern den zirkadianen Rhythmus und den Pupillenreflex."]},{"n":"Amakrine Zellen","t":["Sie helfen, Bewegung schon im Auge zu „verstehen“.","Über 30 Typen; sie erkennen die Bewegungsrichtung und plötzliche Änderungen und modulieren das Signal Bipolar→Ganglienzelle.","Bsp.: Starburst-Zellen erzeugen die Richtungsselektivität der DS-Ganglienzellen durch asymmetrische Hemmung."]},{"n":"Bipolarzellen","t":["Sie verbinden die Photorezeptoren mit den Ganglienzellen.","Es gibt ON-Kanäle (reagieren auf Licht) und OFF-Kanäle (auf Dunkelheit): die Grundlage des Kontrastsehens in beide Richtungen.","Etwa 12 Typen; ON nutzen mGluR6, OFF ionotrope Glutamatrezeptoren. Midget-Bipolarzellen bewahren die Auflösung in der Fovea (1 Zapfen → 1 Bipolarzelle → 1 Ganglienzelle)."]},{"n":"Horizontalzellen","t":["Sie machen das Bild kontrastreicher, indem sie Kanten betonen.","Sie verbinden benachbarte Photorezeptoren seitlich und hemmen sie (laterale Hemmung): Das erklärt die Mach-Bänder und teilweise das Hermann-Gitter.","Die Rückkopplung Horizontalzelle→Zapfen regelt die Verstärkung der Synapse und trägt zur Farbkonstanz und Lichtadaptation bei."]},{"n":"Photorezeptoren","t":["Sie fangen das Licht ein: ~120 Mio. Stäbchen (Nacht) und ~6 Mio. Zapfen (Tag und Farbe).","Stäbchen sehen bei schwachem Licht ohne Farbe; die L-, M- und S-Zapfen liefern die Farbe und sind in der Fovea konzentriert. Bei Licht hyperpolarisieren die Photorezeptoren.","Phototransduktion: Photon → Rhodopsin/Opsin → Transducin → PDE6 senkt cGMP → CNG-Kanäle schließen sich. Ein Stäbchen kann auf ein einziges Photon reagieren."]},{"n":"Pigmentepithel","t":["Es absorbiert Streulicht und versorgt die Photorezeptoren.","Es regeneriert das vom Licht verbrauchte Sehpigment (Retinal).","Es phagozytiert täglich die Spitzen der Außensegmente; seine Funktionsstörung ist an der altersbedingten Makuladegeneration beteiligt."]}],"f_h":"Blick-Simulator","f_p":["Bewege den Finger oder die Maus über das Bild: Dort schaust du hin. Nur die Mitte ist scharf; der Rest ist unscharf und weniger farbig, obwohl du im Alltag den Eindruck hast, alles klar zu sehen.","Die Fovea (~2° des Gesichtsfelds) hat eine enorme Zapfendichte. Zur Peripherie werden die Zapfen seltener, und mehrere Photorezeptoren laufen auf dieselbe Ganglienzelle zusammen, sodass die Auflösung schnell abnimmt.","Die Zapfendichte sinkt von der Größenordnung 150.000–200.000/mm² in der Fovea auf unter 10.000/mm² bei ~10° Exzentrizität. Wegen der kortikalen Vergrößerung belegt ein kleiner Teil der Netzhaut einen großen Teil von V1."],"f_rad":"Fovea-Radius","f_ill":"Illusion zeigen (alles scharf)","f_s1":"Die Fovea sieht Details.","f_s2":"Die Peripherie rät, und das Gehirn ergänzt.","f_words":"Netzhaut Fovea Zapfen Stäbchen Ganglion Sehnerv Cortex visuell Sakkade Lidschlag Illusion Kontext Vorhersage","o_h":"Blinder Fleck","o_p":["Im Auge gibt es eine „blinde“ Zone, aber du siehst sie nicht: Das Gehirn füllt sie auf.","Dort, wo der Sehnerv das Auge verlässt, gibt es keine Photorezeptoren; im Gesichtsfeld entsteht ein „Loch“ von etwa 5°×7°.","Er liegt ~15° temporal von der Fixation, leicht unterhalb der Horizontalen. Das Auffüllen (Filling-in) beinhaltet Aktivität im visuellen Kortex, nicht nur das Ignorieren der Lücke."],"o_pos":"Position der Marke","o_dot":"Punkt","o_gap":"Unterbrochene Linie","o_tex":"Textur","o_how":"<b>So geht’s:</b> Decke das <b>linke</b> Auge ab, schau mit dem rechten Auge auf das Kreuz, ohne den Blick zu bewegen. Halte den Bildschirm im ~3–4-fachen des physischen Abstands zwischen Kreuz und Marke. Bewege den Regler langsam: Die Marke verschwindet. Bei der Linie „schließt“ sich die Lücke; bei der Textur erscheinen die Streifen.","i_h":"Illusionen: Netzhaut und Gehirn bei der Arbeit","i_herm":"Hermann-Gitter","i_mach":"Mach-Bänder","i_trox":"Troxler","i_after":"Nachbild","i_flash":"Flash-Lag","l_hw":"Linienstärke","n_herm":["An den weißen Kreuzungen erscheinen graue Punkte, obwohl dort nichts Graues ist.","Klassische Erklärung: laterale Hemmung in den Zentrum-Umfeld-Rezeptionsfeldern. An Kreuzungen hemmt das weiße Umfeld das Zentrum stärker als in einem Gang.","Die Illusion bleibt auch bei gewellten Linien bestehen, was die rein retinale Erklärung widerlegt (Geier u. a.); es werden auch kortikale Modelle vorgeschlagen."],"l_mg":"Stärke der Hemmung","mach_lbl":"weiß: tatsächliche Leuchtdichte · orange: Zentrum-Umfeld-Antwort","n_mach":["Jedes Band hat ein gleichmäßiges Grau, wirkt aber neben dem dunkleren Nachbarn heller und umgekehrt.","Die Netzhaut übertreibt Kanten durch die Zentrum-Umfeld-Organisation. Unten: die tatsächliche Leuchtdichte (weiß) und die simulierte Antwort (orange), mit Über- und Unterschwingern an den Kanten.","Das Modell ist eine Differenz von Gauß-Funktionen (σ Zentrum=3 px, σ Umfeld=9 px). Klassische Mach-Bänder entstehen bei Rampenübergängen; die Stufen hier zeigen nur die Filterantwort."],"l_start":"Start","n_trox":["Fixiere den schwarzen Punkt: Nach einigen Sekunden verschwinden die Flecken ringsum.","Die Netzhaut passt ihre Antwort an stabile Reize an; die Neuronen reagieren vor allem auf Veränderung, und das Gehirn ergänzt mit dem Hintergrund.","Der Effekt ist in der Peripherie stärker, wo die Rezeptionsfelder groß sind; Mikrosakkaden wirken der Adaptation unter normalen Bedingungen teilweise entgegen."],"c_red":"Rot","c_green":"Grün","c_blue":"Blau","c_yellow":"Gelb","a_start":"20 s hinschauen","a_ph":"Schau jetzt auf den Punkt","n_after":["Fixiere 20 Sekunden lang, dann schau auf die weiße Fläche: Du siehst die Gegenfarbe, obwohl es sie in der Welt nicht gibt.","Die Zapfen haben sich an die fixierte Farbe angepasst und reagieren schwach auf weißes Licht; die komplementären bleiben aktiver.","Gegenfarbentheorie (Hering): Die Adaptation tritt in den Zapfen und in den nachfolgenden Gegenfarbenkanälen auf; manche Nachbilder bleiben bei geschlossenen Augen bestehen, haben also auch eine kortikale Komponente."],"l_truth":"Tatsächliche Ausrichtung zeigen","n_flash":["Schau auf das Kreuz. Der aufblitzende weiße Punkt scheint hinter dem grünen zurückzubleiben, obwohl sie ausgerichtet sind.","Das Gehirn gleicht die Verzögerung von ~100 ms aus, indem es die Bewegung des bewegten Objekts extrapoliert, aber nicht die des aufblitzenden.","Konkurrierende Erklärungen: Extrapolation (Nijhawan), Latenzunterschiede (Whitney), zeitliche Mittelung. Der Effekt zeigt, dass die Wahrnehmung der „Gegenwart“ eine Schätzung ist."],"b_h":"Bilanz: wie viel wir sehen und wie viel wir ergänzen","b_p":["Visuelle Wahrnehmung ist näher an einer „kontrollierten Halluzination“ (Formulierung von Anil Seth): einer fortlaufenden Hypothese des Gehirns, korrigiert durch die Signale der Netzhaut.","Im Modell der „prädiktiven Kodierung“ sendet das Gehirn Vorhersagen nach unten, und die Vorhersagefehler steigen nach oben.","Formulierungen: Rao & Ballard, Friston. Höhere Schichten sagen die Aktivität der unteren voraus; überwiegend wird der Fehler weitergeleitet. Das Modell bleibt als vollständige Erklärung umstritten."],"b_c1":"Kompression: 120 → 1","b_c1n":"≈126 Millionen Photorezeptoren → ≈1 Million Fasern im Sehnerv. Die Netzhaut komprimiert vor der Übertragung.","b_c2":"Wie viel des Gesichtsfelds ist wirklich scharf?","b_ang":"Winkel des scharfen Sehens:","b_pct_t":"des Gesichtsfelds (Ellipse ≈200°×135°) sind in einem Moment im Fokus. Der Rest wird angenähert oder aus dem Kontext ergänzt.","s1":"der Netzhautfläche ist die Fovea, aber ein sehr großer Teil des primären visuellen Kortex ist ihr gewidmet.","s2":"blinder Fleck: eine Zone ohne Information, automatisch aufgefüllt.","s3":"Sakkaden: Das Sehen ist währenddessen unterdrückt, und du bemerkst die „Lücken“ nicht.","s4":"Lidschläge: Jeder unterbricht das Bild für ~0,1–0,15 s, und das Gehirn „klebt“ die Szene zusammen.","s5":"Verzögerung Netzhaut → Bewusstsein; das Gehirn sagt voraus, du nimmst also eine kleine Extrapolation wahr.","s6":"ungefähr so viel der Synapsen des seitlichen Kniehöckers kommt direkt aus der Netzhaut; der Rest ist Rückkopplung (Richtwert).","b_concl":"<b>Fazit.</b> Die Netzhaut sendet eine komprimierte Skizze mit betonten Kanten und fehlenden Bereichen. Das Gehirn konstruiert die „klare und kontinuierliche“ Szene, die du erlebst. Fehlt die Eingabe, läuft die Konstruktion von selbst weiter: Bei manchen Menschen mit schwerem Sehverlust tritt das Charles-Bonnet-Syndrom auf, mit lebhaften, nicht existierenden Bildern.","b_note":"Ungefähre Zahlen aus der klassischen Literatur (z. B. Curcio u. a., Jonas u. a., Sherman & Guillery); sie variieren zwischen Individuen. Bildungsanwendung, kein Diagnosewerkzeug.","q_h":"Quiz","q_intro":"Zehn Fragen zu Netzhaut und Wahrnehmung.","q_of":"Frage","q_next":"Weiter","q_fin":"Ergebnis ansehen","q_again":"Quiz wiederholen","q_score":"Punktzahl","q_ok":"Richtig!","q_no":"Falsch.","q_m":["Du solltest die Abschnitte noch einmal lesen.","Gut!","Ausgezeichnet!"],"Q":[{"q":"Auf welche Schichten trifft das Licht zuerst in der Netzhaut?","o":["Direkt auf die Photorezeptoren","Auf die Ganglienzellen und die übrigen Schichten, vor den Photorezeptoren","Auf das Pigmentepithel","Nur auf die Bipolarzellen"],"a":1,"e":"Die Netzhaut ist „invertiert“: Das Licht durchquert die inneren Schichten vor den Photorezeptoren."},{"q":"Welches Verhältnis besteht ungefähr zwischen Photorezeptoren und Sehnervenfasern?","o":["1 : 1","~10 : 1","~120 : 1","~1000 : 1"],"a":2,"e":"≈126 Mio. Photorezeptoren gegenüber ≈1 Mio. Fasern: Die Netzhaut komprimiert die Information."},{"q":"Welche Zellen bewirken die laterale Hemmung auf Ebene der Photorezeptoren?","o":["Die Bipolarzellen","Die Horizontalzellen","Die Ganglienzellen","Das Pigmentepithel"],"a":1,"e":"Horizontalzellen verbinden die Photorezeptoren seitlich und verstärken den Kontrast."},{"q":"Warum gibt es den blinden Fleck?","o":["Die Linse hat einen Defekt","Wo der Sehnerv austritt, gibt es keine Photorezeptoren","Die Fovea deckt die Zone ab","Das Gehirn schneidet einen Teil des Bildes ab"],"a":1,"e":"Die Papille enthält keine Photorezeptoren, also wird dort kein Licht registriert."},{"q":"Wie viel des Gesichtsfelds deckt das sehr scharfe Sehen (Fovea) ab?","o":["~2°","~30°","~90°","Die Hälfte des Feldes"],"a":0,"e":"Nur ~2°; der Rest ist viel weniger detailliert."},{"q":"Mach-Bänder entstehen hauptsächlich durch…","o":["Lichtreflexion im Auge","laterale Hemmung, die Kanten betont","Sensorrauschen","Lidschlag"],"a":1,"e":"Die Zentrum-Umfeld-Organisation übertreibt den Kontrast an den Kanten."},{"q":"Der Troxler-Effekt zeigt, dass…","o":["die Netzhaut ihre Antwort an stabile Reize anpasst","das Auge nur Bewegung sieht","die Flecken real sind und verschwinden","die Zapfen kaputtgehen"],"a":0,"e":"Stabile Reize werden „vergessen“, und das Gehirn ergänzt mit dem Hintergrund."},{"q":"Warum siehst du ein Nachbild in der Komplementärfarbe?","o":["Das Bild bleibt auf der Linse","Angepasste Rezeptoren reagieren schwach, und die Gegenkanäle dominieren","Der Bildschirm speichert das Licht","Die Augenmuskeln ermüden"],"a":1,"e":"Die Adaptation verringert die Antwort auf die fixierte Farbe; es entsteht der Eindruck der Gegenfarbe."},{"q":"Was legt der Flash-Lag-Effekt nahe?","o":["Das Auge sieht ohne Verzögerung","Das Gehirn extrapoliert die Bewegung, um die Verzögerung auszugleichen","Aufblitzende Objekte sind schneller","Die Netzhaut kehrt die Zeit um"],"a":1,"e":"Die Wahrnehmung der „Gegenwart“ ist eine Vorhersage, die die Latenz von ~100 ms ausgleicht."},{"q":"Was bedeutet „kontrollierte Halluzination“?","o":["Dass Menschen Geister sehen","Wahrnehmung ist eine Vorhersage des Gehirns, korrigiert durch Sinnessignale","Dass die Netzhaut defekt ist","Dass das Sehen zufällig ist"],"a":1,"e":"Das Gehirn erzeugt die Hypothese; die Sinneseingaben korrigieren sie."}],"foot":"MIRAJ · Single-File-HTML-Anwendung, offline, ohne Grenzen · trade-free"};
T.es={"sub":"Cómo procesa la retina y cuánto alucinamos","lvl_lbl":"Nivel:","lvl1":"Principiante","lvl2":"Medio","lvl3":"Avanzado","tab_retina":"Retina","tab_fovea":"Fóvea","tab_orb":"Punto ciego","tab_ill":"Ilusiones","tab_bil":"Balance","tab_quiz":"Test","r_h":"Un ordenador en el fondo del ojo","r_p":["La retina recibe la imagen y la envía al cerebro. Toca una capa para ver qué hace.","La retina no es un sensor pasivo: es tejido cerebral, que procesa la imagen en varios tipos de células antes de que algo salga hacia el cerebro.","Organización: tres capas de cuerpos celulares (ONL, INL, GCL) separadas por dos capas plexiformes (OPL, IPL), donde están las sinapsis. La información se filtra en paralelo en más de 20 canales ganglionares."],"r_hint_h":"Elige una capa","r_hint_p":"La luz entra por arriba. La retina está «invertida»: la luz atraviesa casi todas las capas antes de llegar a los fotorreceptores.","r_light":"luz","r_path":"línea punteada: conos → bipolar → ganglionar → cerebro","layers":[{"n":"Fibras del nervio óptico","t":["El cable que lleva la imagen al cerebro: ~1 millón de fibras.","Son los axones de las células ganglionares; convergen en la papila óptica y forman el nervio óptico. El lugar por donde salen no tiene fotorreceptores: el punto ciego.","El nervio óptico tiene ~1,0–1,2 millones de axones; la mayoría van al núcleo geniculado lateral (NGL), otros al colículo superior y a otros destinos."]},{"n":"Células ganglionares","t":["Las únicas células que envían la señal al cerebro, en forma de impulsos.","Tienen campos receptivos centro–periferia: responden al contraste, no a la luz absoluta.","Tipos principales: M/parasol (movimiento, contraste), P/midget (detalle fino, rojo–verde), K (azul–amarillo). Las ipRGC con melanopsina regulan el ritmo circadiano y el reflejo pupilar."]},{"n":"Células amacrinas","t":["Ayudan a «entender» el movimiento ya en el propio ojo.","Más de 30 tipos; detectan la dirección del movimiento y los cambios bruscos, modulando la señal bipolar→ganglionar.","Ej.: las células starburst generan la selectividad direccional de las ganglionares DS mediante inhibición asimétrica."]},{"n":"Células bipolares","t":["Conectan los fotorreceptores con las células ganglionares.","Existen canales ON (responden a la luz) y OFF (a la oscuridad): la base de la visión de contrastes en ambos sentidos.","Unos 12 tipos; las ON usan mGluR6, las OFF receptores ionotrópicos de glutamato. Las bipolares midget conservan la resolución en la fóvea (1 cono → 1 bipolar → 1 ganglionar)."]},{"n":"Células horizontales","t":["Hacen la imagen más contrastada, acentuando los bordes.","Conectan lateralmente los fotorreceptores vecinos y los inhiben (inhibición lateral): explica las bandas de Mach y, en parte, la rejilla de Hermann.","La retroalimentación horizontal→cono regula la ganancia de la sinapsis y contribuye a la constancia del color y a la adaptación a la luz."]},{"n":"Fotorreceptores","t":["Captan la luz: ~120 M de bastones (noche) y ~6 M de conos (día y color).","Los bastones ven con poca luz, sin color; los conos L, M, S dan el color y se concentran en la fóvea. Con luz, los fotorreceptores se hiperpolarizan.","Fototransducción: fotón → rodopsina/opsina → transducina → PDE6 reduce el GMPc → los canales CNG se cierran. Un bastón puede responder a un solo fotón."]},{"n":"Epitelio pigmentario","t":["Absorbe la luz dispersa y nutre a los fotorreceptores.","Regenera el pigmento visual (el retinal) consumido por la luz.","Fagocita a diario las puntas de los segmentos externos; su disfunción está implicada en la degeneración macular asociada a la edad."]}],"f_h":"Simulador de mirada","f_p":["Mueve el dedo o el ratón sobre la imagen: ahí es donde miras. Solo el centro es nítido; el resto es borroso y menos colorido, aunque en la vida tienes la impresión de verlo todo con claridad.","La fóvea (~2° del campo visual) tiene una densidad enorme de conos. Hacia la periferia los conos se vuelven escasos y varios fotorreceptores convergen en la misma célula ganglionar, así que la resolución cae rápido.","La densidad de conos baja del orden de 150.000–200.000/mm² en la fóvea a menos de 10.000/mm² a ~10° de excentricidad. La magnificación cortical hace que una pequeña fracción de la retina ocupe gran parte de V1."],"f_rad":"Radio de la fóvea","f_ill":"Mostrar la ilusión (todo nítido)","f_s1":"La fóvea ve detalles.","f_s2":"La periferia adivina, y el cerebro completa.","f_words":"retina fóvea cono bastón ganglión nervio óptico corteza visual sacada parpadeo ilusión contexto predicción","o_h":"Punto ciego","o_p":["En el ojo hay una zona «ciega», pero no la ves: el cerebro la rellena.","Donde el nervio óptico sale del ojo no hay fotorreceptores; en el campo visual aparece un «agujero» de unos 5°×7°.","Se encuentra a ~15° en el lado temporal respecto a la fijación, un poco por debajo de la horizontal. El relleno (filling-in) implica actividad en la corteza visual, no solo ignorar el hueco."],"o_pos":"Posición de la marca","o_dot":"Punto","o_gap":"Línea interrumpida","o_tex":"Textura","o_how":"<b>Cómo:</b> tapa el ojo <b>izquierdo</b>, mira la cruz con el ojo derecho sin mover la mirada. Mantén la pantalla a ~3–4 veces la distancia física entre la cruz y la marca. Mueve despacio el deslizador: la marca desaparece. En la línea, el hueco se «cierra»; en la textura aparecen las rayas.","i_h":"Ilusiones: la retina y el cerebro trabajando","i_herm":"Rejilla de Hermann","i_mach":"Bandas de Mach","i_trox":"Troxler","i_after":"Postimagen","i_flash":"Flash-lag","l_hw":"Grosor de las líneas","n_herm":["Aparecen puntos grises en las intersecciones blancas, aunque allí no hay nada gris.","Explicación clásica: inhibición lateral en los campos receptivos centro–periferia. En las intersecciones, la periferia blanca inhibe más el centro que en un pasillo.","La ilusión persiste incluso con líneas onduladas, lo que contradice la explicación puramente retiniana (Geier y col.); también se proponen modelos corticales."],"l_mg":"Intensidad de la inhibición","mach_lbl":"blanco: luminancia real · naranja: respuesta centro–periferia","n_mach":["Cada banda es de un gris uniforme, pero parece más clara junto a la vecina más oscura y viceversa.","La retina exagera los bordes por la organización centro–periferia. Abajo: la luminancia real (blanco) y la respuesta simulada (naranja), con sobre- y subimpulso en los bordes.","El modelo es una diferencia de gaussianas (σ centro=3 px, σ periferia=9 px). Las bandas de Mach clásicas aparecen en transiciones en rampa; los escalones de aquí solo ilustran la respuesta del filtro."],"l_start":"Empezar","n_trox":["Fija el punto negro: tras unos segundos, las manchas alrededor desaparecen.","La retina adapta su respuesta a los estímulos estables; las neuronas responden sobre todo al cambio, y el cerebro completa con el fondo.","El efecto es más fuerte en la periferia, donde los campos receptivos son grandes; los microsacádicos contrarrestan en parte la adaptación en condiciones normales."],"c_red":"Rojo","c_green":"Verde","c_blue":"Azul","c_yellow":"Amarillo","a_start":"Mirar 20 s","a_ph":"Ahora mira el punto","n_after":["Fija durante 20 segundos y luego mira el campo blanco: ves el color opuesto, aunque no existe en el mundo.","Los conos se adaptaron al color fijado y responden débilmente a la luz blanca; los complementarios quedan más activos.","Teoría de los canales oponentes (Hering): la adaptación aparece en los conos y en los canales oponentes siguientes; algunas postimágenes persisten con los ojos cerrados, por lo que también tienen un componente cortical."],"l_truth":"Mostrar la alineación real","n_flash":["Mira la cruz. El punto blanco que parpadea parece quedarse atrás respecto al verde, aunque están alineados.","El cerebro compensa el retraso de ~100 ms extrapolando el movimiento del objeto en movimiento, pero no el del que parpadea.","Explicaciones en competencia: extrapolación (Nijhawan), diferencias de latencia (Whitney), promediado temporal. El efecto muestra que la percepción del «presente» es una estimación."],"b_h":"Balance: cuánto vemos y cuánto completamos","b_p":["La percepción visual está más cerca de una «alucinación controlada» (formulación de Anil Seth): una hipótesis continua del cerebro, corregida por las señales de la retina.","En el modelo de «codificación predictiva», el cerebro envía predicciones hacia abajo y los errores de predicción suben.","Formulaciones: Rao & Ballard, Friston. Las capas superiores predicen la actividad de las inferiores; se propaga sobre todo el error. El modelo sigue debatido como explicación completa."],"b_c1":"Compresión: 120 → 1","b_c1n":"≈126 millones de fotorreceptores → ≈1 millón de fibras en el nervio óptico. La retina comprime antes de transmitir.","b_c2":"¿Cuánto del campo visual es realmente nítido?","b_ang":"Ángulo de visión nítida:","b_pct_t":"del campo visual (elipse ≈200°×135°) está enfocado en un momento dado. El resto se aproxima o se completa a partir del contexto.","s1":"de la superficie de la retina es la fóvea, pero una parte muy grande de la corteza visual primaria se le dedica.","s2":"punto ciego: una zona sin información, completada automáticamente.","s3":"sacadas: la visión se suprime durante ellas, y no notas los «huecos».","s4":"parpadeos: cada uno interrumpe la imagen ~0,1–0,15 s, y el cerebro «pega» la escena.","s5":"retraso retina → conciencia; el cerebro predice, así que percibes una pequeña extrapolación.","s6":"aproximadamente esta parte de las sinapsis del núcleo geniculado lateral viene directamente de la retina; el resto es retroalimentación (cifra orientativa).","b_concl":"<b>Conclusión.</b> La retina envía un boceto comprimido, con bordes acentuados y zonas ausentes. El cerebro construye la escena «clara y continua» que vives. Cuando falta la entrada, la construcción continúa sola: en algunas personas con pérdida grave de visión aparece el síndrome de Charles Bonnet, con imágenes vívidas inexistentes.","b_note":"Cifras aproximadas de la literatura clásica (p. ej. Curcio y col., Jonas y col., Sherman & Guillery); varían entre individuos. Aplicación educativa, no una herramienta de diagnóstico.","q_h":"Test","q_intro":"Diez preguntas sobre la retina y la percepción.","q_of":"Pregunta","q_next":"Siguiente","q_fin":"Ver el resultado","q_again":"Repetir el test","q_score":"Puntuación","q_ok":"¡Correcto!","q_no":"Incorrecto.","q_m":["Te queda por releer las secciones.","¡Bien!","¡Excelente!"],"Q":[{"q":"¿Por qué capas llega primero la luz en la retina?","o":["Directamente a los fotorreceptores","A las células ganglionares y las demás capas, antes que a los fotorreceptores","Al epitelio pigmentario","Solo a las células bipolares"],"a":1,"e":"La retina está «invertida»: la luz atraviesa las capas internas antes que los fotorreceptores."},{"q":"¿Qué proporción aproximada hay entre fotorreceptores y fibras del nervio óptico?","o":["1 : 1","~10 : 1","~120 : 1","~1000 : 1"],"a":2,"e":"≈126 M de fotorreceptores frente a ≈1 M de fibras: la retina comprime la información."},{"q":"¿Qué células realizan la inhibición lateral a nivel de los fotorreceptores?","o":["Las células bipolares","Las células horizontales","Las células ganglionares","El epitelio pigmentario"],"a":1,"e":"Las células horizontales conectan lateralmente los fotorreceptores y acentúan el contraste."},{"q":"¿Por qué existe el punto ciego?","o":["El cristalino tiene un defecto","Donde sale el nervio óptico no hay fotorreceptores","La fóvea cubre la zona","El cerebro recorta una parte de la imagen"],"a":1,"e":"La papila óptica no contiene fotorreceptores, así que allí no se registra la luz."},{"q":"¿Cuánto del campo visual abarca la visión muy nítida (fóvea)?","o":["~2°","~30°","~90°","La mitad del campo"],"a":0,"e":"Solo ~2°; el resto tiene mucho menos detalle."},{"q":"Las bandas de Mach aparecen principalmente debido a…","o":["La reflexión de la luz en el ojo","La inhibición lateral que acentúa los bordes","El ruido de los sensores","El parpadeo"],"a":1,"e":"La organización centro–periferia exagera el contraste en los bordes."},{"q":"El efecto Troxler muestra que…","o":["La retina adapta su respuesta a los estímulos estables","El ojo solo ve el movimiento","Las manchas son reales y desaparecen","Los conos se estropean"],"a":0,"e":"Los estímulos estables se «olvidan» y el cerebro completa con el fondo."},{"q":"¿Por qué ves una postimagen en el color complementario?","o":["La imagen se queda en el cristalino","Los receptores adaptados responden débilmente y dominan los canales opuestos","La pantalla conserva la luz","Los músculos del ojo se cansan"],"a":1,"e":"La adaptación reduce la respuesta al color fijado; aparece la impresión del color opuesto."},{"q":"¿Qué sugiere el efecto flash-lag?","o":["El ojo ve sin retraso","El cerebro extrapola el movimiento para compensar el retraso","Los objetos que parpadean son más rápidos","La retina invierte el tiempo"],"a":1,"e":"La percepción del «presente» es una predicción que compensa la latencia de ~100 ms."},{"q":"¿Qué significa «alucinación controlada»?","o":["Que la gente ve fantasmas","Que la percepción es una predicción del cerebro, corregida por las señales sensoriales","Que la retina es defectuosa","Que la visión es aleatoria"],"a":1,"e":"El cerebro genera la hipótesis; las entradas sensoriales la corrigen."}],"foot":"MIRAJ · aplicación HTML de archivo único, sin conexión, sin fronteras · trade-free"};
T.it={"sub":"Come elabora la retina e quanto allucini","lvl_lbl":"Livello:","lvl1":"Principiante","lvl2":"Medio","lvl3":"Avanzato","tab_retina":"Retina","tab_fovea":"Fovea","tab_orb":"Punto cieco","tab_ill":"Illusioni","tab_bil":"Bilancio","tab_quiz":"Quiz","r_h":"Un computer in fondo all’occhio","r_p":["La retina riceve l’immagine e la invia al cervello. Tocca uno strato per vedere cosa fa.","La retina non è un sensore passivo: è tessuto cerebrale, che elabora l’immagine in diversi tipi di cellule prima che qualcosa parta verso il cervello.","Organizzazione: tre strati di corpi cellulari (ONL, INL, GCL) separati da due strati plessiformi (OPL, IPL), dove si trovano le sinapsi. L’informazione è filtrata in parallelo in oltre 20 canali gangliari."],"r_hint_h":"Scegli uno strato","r_hint_p":"La luce entra dall’alto. La retina è «invertita»: la luce attraversa quasi tutti gli strati prima di raggiungere i fotorecettori.","r_light":"luce","r_path":"linea tratteggiata: coni → bipolare → gangliare → cervello","layers":[{"n":"Fibre del nervo ottico","t":["Il cavo che porta l’immagine al cervello: ~1 milione di fibre.","Sono gli assoni delle cellule gangliari; convergono sulla papilla ottica e formano il nervo ottico. Il punto da cui escono non ha fotorecettori: il punto cieco.","Il nervo ottico ha ~1,0–1,2 milioni di assoni; la maggior parte va al nucleo genicolato laterale (LGN), altri al collicolo superiore e ad altri bersagli."]},{"n":"Cellule gangliari","t":["Le sole cellule che inviano il segnale al cervello, sotto forma di impulsi.","Hanno campi recettivi centro–periferia: rispondono al contrasto, non alla luce assoluta.","Tipi principali: M/parasol (movimento, contrasto), P/midget (dettaglio fine, rosso–verde), K (blu–giallo). Le ipRGC con melanopsina regolano il ritmo circadiano e il riflesso pupillare."]},{"n":"Cellule amacrine","t":["Aiutano a «capire» il movimento già nell’occhio.","Oltre 30 tipi; rilevano la direzione del movimento e i cambiamenti improvvisi, modulando il segnale bipolare→gangliare.","Es.: le cellule starburst generano la selettività direzionale delle gangliari DS tramite inibizione asimmetrica."]},{"n":"Cellule bipolari","t":["Collegano i fotorecettori alle cellule gangliari.","Esistono canali ON (rispondono alla luce) e OFF (al buio): la base della visione dei contrasti in entrambi i sensi.","Circa 12 tipi; le ON usano mGluR6, le OFF recettori ionotropici del glutammato. Le bipolari midget conservano la risoluzione nella fovea (1 cono → 1 bipolare → 1 gangliare)."]},{"n":"Cellule orizzontali","t":["Rendono l’immagine più contrastata, accentuando i bordi.","Collegano lateralmente i fotorecettori vicini e li inibiscono (inibizione laterale): spiega le bande di Mach e, in parte, la griglia di Hermann.","Il feedback orizzontale→cono regola il guadagno della sinapsi e contribuisce alla costanza del colore e all’adattamento alla luce."]},{"n":"Fotorecettori","t":["Catturano la luce: ~120 M di bastoncelli (notte) e ~6 M di coni (giorno e colore).","I bastoncelli vedono con poca luce, senza colore; i coni L, M, S danno il colore e sono concentrati nella fovea. Alla luce, i fotorecettori si iperpolarizzano.","Fototrasduzione: fotone → rodopsina/opsina → transducina → PDE6 abbassa il cGMP → i canali CNG si chiudono. Un bastoncello può rispondere a un solo fotone."]},{"n":"Epitelio pigmentato","t":["Assorbe la luce diffusa e nutre i fotorecettori.","Rigenera il pigmento visivo (il retinale) consumato dalla luce.","Fagocita ogni giorno le punte dei segmenti esterni; la sua disfunzione è coinvolta nella degenerazione maculare legata all’età."]}],"f_h":"Simulatore di sguardo","f_p":["Sposta il dito o il mouse sull’immagine: è lì che guardi. Solo il centro è nitido; il resto è sfocato e meno colorato, anche se nella vita hai l’impressione di vedere tutto chiaramente.","La fovea (~2° del campo visivo) ha una densità enorme di coni. Verso la periferia i coni si diradano e più fotorecettori convergono sulla stessa cellula gangliare, quindi la risoluzione cala in fretta.","La densità dei coni scende dall’ordine di 150.000–200.000/mm² nella fovea a meno di 10.000/mm² a ~10° di eccentricità. L’ingrandimento corticale fa sì che una piccola frazione della retina occupi gran parte di V1."],"f_rad":"Raggio della fovea","f_ill":"Mostra l’illusione (tutto nitido)","f_s1":"La fovea vede i dettagli.","f_s2":"La periferia indovina, e il cervello completa.","f_words":"retina fovea cono bastoncello ganglio nervo ottico corteccia visiva saccade ammiccamento illusione contesto predizione","o_h":"Punto cieco","o_p":["Nell’occhio c’è una zona «cieca», ma non la vedi: il cervello la riempie.","Dove il nervo ottico esce dall’occhio non ci sono fotorecettori; nel campo visivo appare un «buco» di circa 5°×7°.","Si trova a ~15° sul lato temporale rispetto alla fissazione, un po’ sotto l’orizzontale. Il riempimento (filling-in) implica attività nella corteccia visiva, non solo l’ignorare il vuoto."],"o_pos":"Posizione del segno","o_dot":"Punto","o_gap":"Linea interrotta","o_tex":"Texture","o_how":"<b>Come:</b> copri l’occhio <b>sinistro</b>, guarda la croce con l’occhio destro senza muovere lo sguardo. Tieni lo schermo a ~3–4 volte la distanza fisica tra la croce e il segno. Muovi lentamente il cursore: il segno scompare. Con la linea, il vuoto si «chiude»; con la texture compaiono le strisce.","i_h":"Illusioni: la retina e il cervello al lavoro","i_herm":"Griglia di Hermann","i_mach":"Bande di Mach","i_trox":"Troxler","i_after":"Immagine residua","i_flash":"Flash-lag","l_hw":"Spessore delle linee","n_herm":["Compaiono punti grigi alle intersezioni bianche, anche se lì non c’è nulla di grigio.","Spiegazione classica: inibizione laterale nei campi recettivi centro–periferia. Alle intersezioni, la periferia bianca inibisce il centro più che in un corridoio.","L’illusione persiste anche con linee ondulate, il che contraddice la spiegazione puramente retinica (Geier e coll.); si propongono anche modelli corticali."],"l_mg":"Intensità dell’inibizione","mach_lbl":"bianco: luminanza reale · arancione: risposta centro–periferia","n_mach":["Ogni banda è di un grigio uniforme, ma sembra più chiara accanto alla vicina più scura e viceversa.","La retina esagera i bordi con l’organizzazione centro–periferia. In basso: la luminanza reale (bianco) e la risposta simulata (arancione), con sovra- e sottoelongazione ai bordi.","Il modello è una differenza di gaussiane (σ centro=3 px, σ periferia=9 px). Le bande di Mach classiche compaiono nelle transizioni a rampa; i gradini qui illustrano solo la risposta del filtro."],"l_start":"Avvia","n_trox":["Fissa il punto nero: dopo qualche secondo, le macchie intorno scompaiono.","La retina adatta la risposta agli stimoli stabili; i neuroni rispondono soprattutto al cambiamento, e il cervello completa con lo sfondo.","L’effetto è più forte in periferia, dove i campi recettivi sono grandi; i microsaccadi contrastano in parte l’adattamento in condizioni normali."],"c_red":"Rosso","c_green":"Verde","c_blue":"Blu","c_yellow":"Giallo","a_start":"Guarda per 20 s","a_ph":"Ora guarda il punto","n_after":["Fissa per 20 secondi, poi guarda il campo bianco: vedi il colore opposto, anche se non esiste nel mondo.","I coni si sono adattati al colore fissato e rispondono debolmente alla luce bianca; restano più attivi i complementari.","Teoria dei canali opponenti (Hering): l’adattamento compare nei coni e nei successivi canali opponenti; alcune immagini residue persistono a occhi chiusi, quindi hanno anche una componente corticale."],"l_truth":"Mostra l’allineamento reale","n_flash":["Guarda la croce. Il punto bianco lampeggiante sembra restare indietro rispetto a quello verde, anche se sono allineati.","Il cervello compensa il ritardo di ~100 ms estrapolando il movimento dell’oggetto in movimento, ma non quello lampeggiante.","Spiegazioni concorrenti: estrapolazione (Nijhawan), differenze di latenza (Whitney), media temporale. L’effetto mostra che la percezione del «presente» è una stima."],"b_h":"Bilancio: quanto vediamo e quanto completiamo","b_p":["La percezione visiva è più vicina a un’«allucinazione controllata» (formulazione di Anil Seth): un’ipotesi continua del cervello, corretta dai segnali della retina.","Nel modello della «codifica predittiva», il cervello invia predizioni verso il basso e gli errori di predizione salgono.","Formulazioni: Rao & Ballard, Friston. Gli strati superiori predicono l’attività di quelli inferiori; si propaga soprattutto l’errore. Il modello resta dibattuto come spiegazione completa."],"b_c1":"Compressione: 120 → 1","b_c1n":"≈126 milioni di fotorecettori → ≈1 milione di fibre nel nervo ottico. La retina comprime prima di trasmettere.","b_c2":"Quanto del campo visivo è davvero nitido?","b_ang":"Angolo di visione nitida:","b_pct_t":"del campo visivo (ellisse ≈200°×135°) è a fuoco in un dato momento. Il resto è approssimato o completato dal contesto.","s1":"della superficie della retina è la fovea, ma una parte molto grande della corteccia visiva primaria le è dedicata.","s2":"punto cieco: una zona senza informazione, completata automaticamente.","s3":"saccadi: la visione è soppressa durante di esse, e non noti i «vuoti».","s4":"ammiccamenti: ciascuno interrompe l’immagine per ~0,1–0,15 s, e il cervello «incolla» la scena.","s5":"ritardo retina → coscienza; il cervello predice, quindi percepisci una piccola estrapolazione.","s6":"circa questa parte delle sinapsi del nucleo genicolato laterale viene direttamente dalla retina; il resto è feedback (cifra indicativa).","b_concl":"<b>Conclusione.</b> La retina invia uno schizzo compresso, con bordi accentuati e zone mancanti. Il cervello costruisce la scena «chiara e continua» che vivi. Quando l’ingresso manca, la costruzione continua da sola: in alcune persone con grave perdita della vista compare la sindrome di Charles Bonnet, con immagini vivide inesistenti.","b_note":"Cifre approssimative dalla letteratura classica (es. Curcio e coll., Jonas e coll., Sherman & Guillery); variano tra gli individui. Applicazione didattica, non uno strumento diagnostico.","q_h":"Quiz","q_intro":"Dieci domande sulla retina e sulla percezione.","q_of":"Domanda","q_next":"Avanti","q_fin":"Vedi il risultato","q_again":"Ripeti il quiz","q_score":"Punteggio","q_ok":"Corretto!","q_no":"Sbagliato.","q_m":["Ti restano da rileggere le sezioni.","Bene!","Eccellente!"],"Q":[{"q":"Su quali strati arriva per prima la luce nella retina?","o":["Direttamente sui fotorecettori","Sulle cellule gangliari e gli altri strati, prima dei fotorecettori","Sull’epitelio pigmentato","Solo sulle cellule bipolari"],"a":1,"e":"La retina è «invertita»: la luce attraversa gli strati interni prima dei fotorecettori."},{"q":"Che rapporto approssimativo c’è tra fotorecettori e fibre del nervo ottico?","o":["1 : 1","~10 : 1","~120 : 1","~1000 : 1"],"a":2,"e":"≈126 M di fotorecettori contro ≈1 M di fibre: la retina comprime l’informazione."},{"q":"Quali cellule realizzano l’inibizione laterale a livello dei fotorecettori?","o":["Le cellule bipolari","Le cellule orizzontali","Le cellule gangliari","L’epitelio pigmentato"],"a":1,"e":"Le cellule orizzontali collegano lateralmente i fotorecettori e accentuano il contrasto."},{"q":"Perché esiste il punto cieco?","o":["Il cristallino ha un difetto","Dove esce il nervo ottico non ci sono fotorecettori","La fovea copre la zona","Il cervello taglia una parte dell’immagine"],"a":1,"e":"La papilla ottica non contiene fotorecettori, quindi lì la luce non viene registrata."},{"q":"Quanto del campo visivo copre la visione molto nitida (fovea)?","o":["~2°","~30°","~90°","Metà del campo"],"a":0,"e":"Solo ~2°; il resto è molto meno dettagliato."},{"q":"Le bande di Mach compaiono principalmente a causa di…","o":["La riflessione della luce nell’occhio","L’inibizione laterale che accentua i bordi","Il rumore dei sensori","L’ammiccamento"],"a":1,"e":"L’organizzazione centro–periferia esagera il contrasto ai bordi."},{"q":"L’effetto Troxler mostra che…","o":["La retina adatta la risposta agli stimoli stabili","L’occhio vede solo il movimento","Le macchie sono reali e scompaiono","I coni si rovinano"],"a":0,"e":"Gli stimoli stabili vengono «dimenticati» e il cervello completa con lo sfondo."},{"q":"Perché vedi un’immagine residua nel colore complementare?","o":["L’immagine resta sul cristallino","I recettori adattati rispondono debolmente e dominano i canali opposti","Lo schermo conserva la luce","I muscoli dell’occhio si affaticano"],"a":1,"e":"L’adattamento riduce la risposta al colore fissato; compare l’impressione del colore opposto."},{"q":"Cosa suggerisce l’effetto flash-lag?","o":["L’occhio vede senza ritardo","Il cervello estrapola il movimento per compensare il ritardo","Gli oggetti lampeggianti sono più veloci","La retina inverte il tempo"],"a":1,"e":"La percezione del «presente» è una predizione che compensa la latenza di ~100 ms."},{"q":"Che cosa significa «allucinazione controllata»?","o":["Che le persone vedono fantasmi","Che la percezione è una predizione del cervello, corretta dai segnali sensoriali","Che la retina è difettosa","Che la vista è casuale"],"a":1,"e":"Il cervello genera l’ipotesi; gli ingressi sensoriali la correggono."}],"foot":"MIRAJ · applicazione HTML a file singolo, offline, senza frontiere · trade-free"};
T.hu={"sub":"Hogyan dolgozza fel a képet a recehártya, és mennyire hallucinálunk","lvl_lbl":"Szint:","lvl1":"Kezdő","lvl2":"Közepes","lvl3":"Haladó","tab_retina":"Recehártya","tab_fovea":"Fovea","tab_orb":"Vakfolt","tab_ill":"Illúziók","tab_bil":"Összegzés","tab_quiz":"Kvíz","r_h":"Egy számítógép a szem hátsó részében","r_p":["A recehártya fogadja a képet, és elküldi az agynak. Érints meg egy réteget, hogy lásd, mit csinál.","A recehártya nem passzív érzékelő: agyszövet, amely többféle sejttípusban dolgozza fel a képet, mielőtt bármi az agyba indulna.","Felépítés: három sejttestréteg (ONL, INL, GCL), amelyeket két plexiform réteg (OPL, IPL) választ el, ahol a szinapszisok vannak. Az információt párhuzamosan, több mint 20 ganglionsejt-csatornában szűri."],"r_hint_h":"Válassz egy réteget","r_hint_p":"A fény felülről érkezik. A recehártya „fordított”: a fény szinte az összes rétegen áthalad, mielőtt elérné a fotoreceptorokat.","r_light":"fény","r_path":"pontozott vonal: csapok → bipoláris → ganglion → agy","layers":[{"n":"Látóidegrostok","t":["A kábel, amely a képet az agyba viszi: ~1 millió rost.","A ganglionsejtek axonjai; a látóideg-fejnél összefutnak, és létrehozzák a látóideget. Ahol kilépnek, nincsenek fotoreceptorok: ez a vakfolt.","A látóidegnek ~1,0–1,2 millió axonja van; többségük a corpus geniculatum laterale-ba (LGN) megy, mások a colliculus superiorba és más célokhoz."]},{"n":"Ganglionsejtek","t":["Az egyetlen sejtek, amelyek a jelet impulzusok formájában az agyba küldik.","Centrum–periféria receptív mezejük van: a kontrasztra reagálnak, nem az abszolút fényre.","Fő típusok: M/parasol (mozgás, kontraszt), P/midget (finom részlet, vörös–zöld), K (kék–sárga). A melanopszint tartalmazó ipRGC-k szabályozzák a cirkadián ritmust és a pupillareflexet."]},{"n":"Amakrin sejtek","t":["Segítenek a mozgás „megértésében” már a szemben.","30-nál több típus; érzékelik a mozgás irányát és a hirtelen változásokat, modulálva a bipoláris→ganglion jelet.","Pl.: a starburst sejtek aszimmetrikus gátlással hozzák létre a DS ganglionsejtek irányszelektivitását."]},{"n":"Bipoláris sejtek","t":["Összekötik a fotoreceptorokat a ganglionsejtekkel.","Vannak ON (fényre reagáló) és OFF (sötétre reagáló) csatornák: ez az alapja a kontrasztlátásnak mindkét irányban.","Kb. 12 típus; az ON sejtek mGluR6-ot, az OFF sejtek ionotróp glutamátreceptorokat használnak. A midget bipolárisok megőrzik a felbontást a foveában (1 csap → 1 bipoláris → 1 ganglion)."]},{"n":"Horizontális sejtek","t":["Kontrasztosabbá teszik a képet az élek kiemelésével.","Oldalirányban összekötik a szomszédos fotoreceptorokat, és gátolják őket (laterális gátlás): ez magyarázza a Mach-sávokat és részben a Hermann-rácsot.","A horizontális→csap visszacsatolás szabályozza a szinapszis erősítését, és hozzájárul a színállandósághoz és a fényadaptációhoz."]},{"n":"Fotoreceptorok","t":["Befogják a fényt: ~120 millió pálcika (éjszaka) és ~6 millió csap (nappal és szín).","A pálcikák gyenge fényben látnak, szín nélkül; az L, M, S csapok adják a színt, és a foveában összpontosulnak. Fényben a fotoreceptorok hiperpolarizálódnak.","Fototranszdukció: foton → rodopszin/opszin → transzducin → a PDE6 csökkenti a cGMP-t → a CNG-csatornák bezáródnak. Egy pálcika egyetlen fotonra is válaszolhat."]},{"n":"Pigmenthám","t":["Elnyeli a szórt fényt, és táplálja a fotoreceptorokat.","Regenerálja a fény által elhasznált látópigmentet (retinál).","Naponta fagocitálja a külső szegmentumok csúcsait; működészavara szerepet játszik az időskori makuladegenerációban."]}],"f_h":"Tekintet-szimulátor","f_p":["Mozgasd az ujjad vagy az egeret a képen: ott nézel. Csak a közepe éles; a többi homályos és kevésbé színes, bár a mindennapokban úgy érzed, mindent tisztán látsz.","A fovea (a látótér ~2°-a) csapsűrűsége óriási. A periféria felé a csapok ritkulnak, és több fotoreceptor fut össze ugyanazon ganglionsejten, így a felbontás gyorsan csökken.","A csapsűrűség a foveában 150 000–200 000/mm² nagyságrendről ~10°-os excentricitásnál 10 000/mm² alá esik. A kérgi nagyítás miatt a recehártya kis hányada a V1 nagy részét foglalja el."],"f_rad":"Fovea sugara","f_ill":"Illúzió mutatása (minden éles)","f_s1":"A fovea részleteket lát.","f_s2":"A periféria találgat, az agy pedig kiegészíti.","f_words":"recehártya fovea csap pálcika ganglion látóideg kéreg vizuális szakkád pislogás illúzió kontextus predikció","o_h":"Vakfolt","o_p":["A szemben van egy „vak” zóna, de nem látod: az agy kitölti.","Ahol a látóideg elhagyja a szemet, nincsenek fotoreceptorok; a látótérben egy kb. 5°×7°-os „lyuk” jelenik meg.","A fixációs ponttól ~15°-ra, temporálisan, kissé a vízszintes alatt található. A kitöltés (filling-in) a látókéreg aktivitását jelenti, nem csupán a rés figyelmen kívül hagyását."],"o_pos":"A jel helyzete","o_dot":"Pont","o_gap":"Szaggatott vonal","o_tex":"Textúra","o_how":"<b>Hogyan:</b> takard le a <b>bal</b> szemed, nézd a keresztet a jobb szeddel, anélkül hogy elmozdítanád a tekinteted. Tartsd a képernyőt a kereszt és a jel közötti fizikai távolság ~3–4-szeresére. Lassan mozgasd a csúszkát: a jel eltűnik. A vonalnál a rés „bezárul”; a textúránál megjelennek a csíkok.","i_h":"Illúziók: a recehártya és az agy munkában","i_herm":"Hermann-rács","i_mach":"Mach-sávok","i_trox":"Troxler","i_after":"Utókép","i_flash":"Flash-lag","l_hw":"Vonalvastagság","n_herm":["Szürke pontok jelennek meg a fehér kereszteződéseknél, bár ott semmi sem szürke.","Klasszikus magyarázat: laterális gátlás a centrum–periféria receptív mezőkben. A kereszteződéseknél a fehér periféria jobban gátolja a centrumot, mint egy folyosón.","Az illúzió hullámos vonalaknál is megmarad, ami ellentmond a tisztán retinális magyarázatnak (Geier és mtsai); kérgi modelleket is javasolnak."],"l_mg":"Gátlás erőssége","mach_lbl":"fehér: tényleges fénysűrűség · narancs: centrum–periféria válasz","n_mach":["Minden sáv egyenletesen szürke, de világosabbnak tűnik a sötétebb szomszéd mellett, és fordítva.","A recehártya a centrum–periféria szerveződéssel eltúlozza az éleket. Lent: a tényleges fénysűrűség (fehér) és a szimulált válasz (narancs), túl- és alullövéssel az éleknél.","A modell Gauss-függvények különbsége (σ centrum=3 px, σ periféria=9 px). A klasszikus Mach-sávok rámpás átmeneteknél jelennek meg; az itteni lépcsők csak a szűrő válaszát szemléltetik."],"l_start":"Indítás","n_trox":["Fixáld a fekete pontot: néhány másodperc után a körülötte lévő foltok eltűnnek.","A recehártya a stabil ingerekhez igazítja a válaszát; az idegsejtek főleg a változásra reagálnak, az agy pedig a háttérrel egészíti ki.","A hatás a periférián erősebb, ahol a receptív mezők nagyok; a mikroszakkádok normál körülmények között részben ellensúlyozzák az adaptációt."],"c_red":"Piros","c_green":"Zöld","c_blue":"Kék","c_yellow":"Sárga","a_start":"Nézd 20 mp-ig","a_ph":"Most nézd a pontot","n_after":["Fixálj 20 másodpercig, majd nézd a fehér mezőt: az ellentétes színt látod, bár a világban nem létezik.","A csapok alkalmazkodtak a fixált színhez, és gyengén válaszolnak a fehér fényre; a komplementerek aktívabbak maradnak.","Ellenszín-elmélet (Hering): az adaptáció a csapokban és a következő ellenszín-csatornákban jelenik meg; egyes utóképek csukott szemmel is megmaradnak, tehát kérgi összetevőjük is van."],"l_truth":"A valódi elrendezés mutatása","n_flash":["Nézd a keresztet. A felvillanó fehér pont úgy tűnik, lemarad a zöld mögött, pedig egy vonalban vannak.","Az agy a kb. 100 ms-os késést a mozgó tárgy mozgásának extrapolálásával kompenzálja, de a felvillanóét nem.","Versengő magyarázatok: extrapoláció (Nijhawan), késleltetési különbségek (Whitney), időbeli átlagolás. A hatás azt mutatja, hogy a „jelen” észlelése becslés."],"b_h":"Összegzés: mennyit látunk és mennyit egészítünk ki","b_p":["A vizuális észlelés közelebb áll egy „kontrollált hallucinációhoz” (Anil Seth megfogalmazása): az agy folyamatos hipotéziséhez, amelyet a recehártya jelei korrigálnak.","A „prediktív kódolás” modelljében az agy lefelé predikciókat küld, a predikciós hibák pedig felfelé haladnak.","Megfogalmazások: Rao & Ballard, Friston. A felsőbb rétegek megjósolják az alsóbbak aktivitását; főként a hiba terjed. A modell teljes magyarázatként továbbra is vitatott."],"b_c1":"Tömörítés: 120 → 1","b_c1n":"≈126 millió fotoreceptor → ≈1 millió rost a látóidegben. A recehártya átvitel előtt tömörít.","b_c2":"A látótér mekkora része valóban éles?","b_ang":"Éles látás szöge:","b_pct_t":"a látótérből (ellipszis ≈200°×135°) van fókuszban egy adott pillanatban. A többit a kontextusból közelítjük vagy egészítjük ki.","s1":"a recehártya felszínéből a fovea, de az elsődleges látókéreg nagyon nagy része neki van szentelve.","s2":"vakfolt: információ nélküli zóna, automatikusan kitöltve.","s3":"szakkádok: alatta a látás elnyomott, és nem veszed észre a „réseket”.","s4":"pislogások: mindegyik ~0,1–0,15 s-re megszakítja a képet, az agy pedig „összeragasztja” a jelenetet.","s5":"késés recehártya → tudat; az agy előre jelez, így egy kis extrapolációt észlelsz.","s6":"nagyjából ennyi a corpus geniculatum laterale szinapszisainak közvetlenül a recehártyából érkező része; a többi visszacsatolás (tájékoztató adat).","b_concl":"<b>Következtetés.</b> A recehártya tömörített vázlatot küld, kiemelt élekkel és hiányzó részekkel. Az agy építi fel a „tiszta és folyamatos” jelenetet, amelyet megélsz. Ha a bemenet hiányzik, az építés magától folytatódik: súlyos látásvesztésben szenvedő embereknél megjelenik a Charles Bonnet-szindróma, élénk, nem létező képekkel.","b_note":"Hozzávetőleges számok a klasszikus szakirodalomból (pl. Curcio és mtsai, Jonas és mtsai, Sherman & Guillery); egyénenként változnak. Oktatási alkalmazás, nem diagnosztikai eszköz.","q_h":"Kvíz","q_intro":"Tíz kérdés a recehártyáról és az észlelésről.","q_of":"Kérdés","q_next":"Következő","q_fin":"Eredmény megtekintése","q_again":"Kvíz újra","q_score":"Pontszám","q_ok":"Helyes!","q_no":"Hibás.","q_m":["Még át kell olvasnod a szakaszokat.","Jó!","Kiváló!"],"Q":[{"q":"Mely rétegeket éri el először a fény a recehártyában?","o":["Közvetlenül a fotoreceptorokat","A ganglionsejteket és a többi réteget, a fotoreceptorok előtt","A pigmenthámot","Csak a bipoláris sejteket"],"a":1,"e":"A recehártya „fordított”: a fény a belső rétegeken halad át a fotoreceptorok előtt."},{"q":"Körülbelül milyen arány van a fotoreceptorok és a látóidegrostok között?","o":["1 : 1","~10 : 1","~120 : 1","~1000 : 1"],"a":2,"e":"≈126 M fotoreceptor ≈1 M rosttal szemben: a recehártya tömöríti az információt."},{"q":"Mely sejtek valósítják meg a laterális gátlást a fotoreceptorok szintjén?","o":["A bipoláris sejtek","A horizontális sejtek","A ganglionsejtek","A pigmenthám"],"a":1,"e":"A horizontális sejtek oldalirányban összekötik a fotoreceptorokat, és kiemelik a kontrasztot."},{"q":"Miért van vakfolt?","o":["A lencsének hibája van","Ahol a látóideg kilép, nincsenek fotoreceptorok","A fovea fedi a területet","Az agy levág egy részt a képből"],"a":1,"e":"A látóideg-fej nem tartalmaz fotoreceptorokat, ezért ott nem érzékelődik fény."},{"q":"A látótér mekkora részét fedi le a nagyon éles látás (fovea)?","o":["~2°","~30°","~90°","A látótér felét"],"a":0,"e":"Csak ~2°; a többi sokkal kevésbé részletes."},{"q":"A Mach-sávok főként ennek köszönhetően jelennek meg…","o":["A fény visszaverődése a szemben","A laterális gátlás, amely kiemeli az éleket","Az érzékelők zaja","A pislogás"],"a":1,"e":"A centrum–periféria szerveződés eltúlozza a kontrasztot az éleknél."},{"q":"A Troxler-hatás azt mutatja, hogy…","o":["a recehártya a stabil ingerekhez igazítja a válaszát","a szem csak a mozgást látja","a foltok valódiak és eltűnnek","a csapok tönkremennek"],"a":0,"e":"A stabil ingereket „elfelejtjük”, az agy pedig a háttérrel egészíti ki."},{"q":"Miért látsz utóképet a komplementer színben?","o":["A kép a lencsén marad","Az adaptált receptorok gyengén válaszolnak, és az ellentétes csatornák dominálnak","A képernyő megőrzi a fényt","A szemizmok elfáradnak"],"a":1,"e":"Az adaptáció csökkenti a fixált színre adott választ; az ellentétes szín benyomása jelenik meg."},{"q":"Mire utal a flash-lag hatás?","o":["A szem késés nélkül lát","Az agy extrapolálja a mozgást a késés kompenzálására","A felvillanó tárgyak gyorsabbak","A recehártya megfordítja az időt"],"a":1,"e":"A „jelen” észlelése egy predikció, amely kompenzálja a ~100 ms-os késleltetést."},{"q":"Mit jelent a „kontrollált hallucináció”?","o":["Hogy az emberek szellemeket látnak","Az észlelés az agy predikciója, amelyet az érzékszervi jelek korrigálnak","Hogy a recehártya hibás","Hogy a látás véletlenszerű"],"a":1,"e":"Az agy generálja a hipotézist; az érzékszervi bemenetek korrigálják."}],"foot":"MIRAJ · egyfájlos HTML-alkalmazás, offline, határok nélkül · trade-free"};
T.pt={"sub":"Como a retina processa e quanto alucinamos","lvl_lbl":"Nível:","lvl1":"Iniciante","lvl2":"Intermédio","lvl3":"Avançado","tab_retina":"Retina","tab_fovea":"Fóvea","tab_orb":"Ponto cego","tab_ill":"Ilusões","tab_bil":"Balanço","tab_quiz":"Teste","r_h":"Um computador no fundo do olho","r_p":["A retina recebe a imagem e envia-a ao cérebro. Toca numa camada para ver o que faz.","A retina não é um sensor passivo: é tecido cerebral, que processa a imagem em vários tipos de células antes de algo seguir para o cérebro.","Organização: três camadas de corpos celulares (ONL, INL, GCL) separadas por duas camadas plexiformes (OPL, IPL), onde estão as sinapses. A informação é filtrada em paralelo em mais de 20 canais ganglionares."],"r_hint_h":"Escolhe uma camada","r_hint_p":"A luz entra por cima. A retina é «invertida»: a luz atravessa quase todas as camadas antes de chegar aos fotorrecetores.","r_light":"luz","r_path":"linha tracejada: cones → bipolar → ganglionar → cérebro","layers":[{"n":"Fibras do nervo ótico","t":["O cabo que leva a imagem ao cérebro: ~1 milhão de fibras.","São os axónios das células ganglionares; convergem na papila ótica e formam o nervo ótico. O local por onde saem não tem fotorrecetores: o ponto cego.","O nervo ótico tem ~1,0–1,2 milhões de axónios; a maioria vai para o núcleo geniculado lateral (NGL), outros para o colículo superior e outros alvos."]},{"n":"Células ganglionares","t":["As únicas células que enviam o sinal ao cérebro, sob a forma de impulsos.","Têm campos recetivos centro–periferia: respondem ao contraste, não à luz absoluta.","Tipos principais: M/parasol (movimento, contraste), P/midget (detalhe fino, vermelho–verde), K (azul–amarelo). As ipRGC com melanopsina regulam o ritmo circadiano e o reflexo pupilar."]},{"n":"Células amácrinas","t":["Ajudam a «perceber» o movimento já no próprio olho.","Mais de 30 tipos; detetam a direção do movimento e as mudanças bruscas, modulando o sinal bipolar→ganglionar.","Ex.: as células starburst geram a seletividade direcional das ganglionares DS por inibição assimétrica."]},{"n":"Células bipolares","t":["Fazem a ligação entre os fotorrecetores e as células ganglionares.","Existem canais ON (respondem à luz) e OFF (à escuridão): a base da visão de contrastes nos dois sentidos.","Cerca de 12 tipos; as ON usam mGluR6, as OFF recetores ionotrópicos de glutamato. As bipolares midget preservam a resolução na fóvea (1 cone → 1 bipolar → 1 ganglionar)."]},{"n":"Células horizontais","t":["Tornam a imagem mais contrastada, acentuando as margens.","Ligam lateralmente os fotorrecetores vizinhos e inibem-nos (inibição lateral): explica as bandas de Mach e, em parte, a grelha de Hermann.","O feedback horizontal→cone regula o ganho da sinapse e contribui para a constância da cor e para a adaptação à luz."]},{"n":"Fotorrecetores","t":["Captam a luz: ~120 M de bastonetes (noite) e ~6 M de cones (dia e cor).","Os bastonetes veem com pouca luz, sem cor; os cones L, M, S dão a cor e concentram-se na fóvea. Com luz, os fotorrecetores hiperpolarizam-se.","Fototransdução: fotão → rodopsina/opsina → transducina → a PDE6 reduz o cGMP → os canais CNG fecham-se. Um bastonete pode responder a um único fotão."]},{"n":"Epitélio pigmentar","t":["Absorve a luz dispersa e nutre os fotorrecetores.","Regenera o pigmento visual (o retinal) consumido pela luz.","Fagocita diariamente as pontas dos segmentos externos; a sua disfunção está implicada na degeneração macular relacionada com a idade."]}],"f_h":"Simulador de olhar","f_p":["Move o dedo ou o rato sobre a imagem: é aí que olhas. Só o centro é nítido; o resto é desfocado e menos colorido, embora na vida tenhas a impressão de ver tudo com clareza.","A fóvea (~2° do campo visual) tem uma densidade enorme de cones. Em direção à periferia os cones rareiam e vários fotorrecetores convergem na mesma célula ganglionar, pelo que a resolução cai depressa.","A densidade dos cones desce da ordem de 150 000–200 000/mm² na fóvea para menos de 10 000/mm² a ~10° de excentricidade. A magnificação cortical faz com que uma pequena fração da retina ocupe grande parte do V1."],"f_rad":"Raio da fóvea","f_ill":"Mostrar a ilusão (tudo nítido)","f_s1":"A fóvea vê detalhes.","f_s2":"A periferia adivinha, e o cérebro completa.","f_words":"retina fóvea cone bastonete gânglio nervo ótico córtex visual sacada piscar ilusão contexto previsão","o_h":"Ponto cego","o_p":["No olho há uma zona «cega», mas não a vês: o cérebro preenche-a.","Onde o nervo ótico sai do olho não há fotorrecetores; no campo visual surge um «buraco» de cerca de 5°×7°.","Situa-se a ~15° do lado temporal em relação à fixação, um pouco abaixo da horizontal. O preenchimento (filling-in) envolve atividade no córtex visual, não apenas ignorar a lacuna."],"o_pos":"Posição da marca","o_dot":"Ponto","o_gap":"Linha interrompida","o_tex":"Textura","o_how":"<b>Como:</b> tapa o olho <b>esquerdo</b>, olha para a cruz com o olho direito sem mover o olhar. Mantém o ecrã a ~3–4 vezes a distância física entre a cruz e a marca. Move lentamente o cursor: a marca desaparece. Na linha, a lacuna «fecha-se»; na textura surgem as riscas.","i_h":"Ilusões: a retina e o cérebro em ação","i_herm":"Grelha de Hermann","i_mach":"Bandas de Mach","i_trox":"Troxler","i_after":"Pós-imagem","i_flash":"Flash-lag","l_hw":"Espessura das linhas","n_herm":["Surgem pontos cinzentos nas interseções brancas, embora aí não haja nada cinzento.","Explicação clássica: inibição lateral nos campos recetivos centro–periferia. Nas interseções, a periferia branca inibe mais o centro do que num corredor.","A ilusão persiste mesmo com linhas onduladas, o que contradiz a explicação puramente retiniana (Geier e col.); também se propõem modelos corticais."],"l_mg":"Intensidade da inibição","mach_lbl":"branco: luminância real · laranja: resposta centro–periferia","n_mach":["Cada banda é de um cinzento uniforme, mas parece mais clara junto da vizinha mais escura e vice-versa.","A retina exagera as margens pela organização centro–periferia. Em baixo: a luminância real (branco) e a resposta simulada (laranja), com sobre- e subimpulso nas margens.","O modelo é uma diferença de gaussianas (σ centro=3 px, σ periferia=9 px). As bandas de Mach clássicas surgem em transições em rampa; os degraus aqui ilustram apenas a resposta do filtro."],"l_start":"Iniciar","n_trox":["Fixa o ponto preto: após alguns segundos, as manchas à volta desaparecem.","A retina adapta a resposta a estímulos estáveis; os neurónios respondem sobretudo à mudança, e o cérebro completa com o fundo.","O efeito é mais forte na periferia, onde os campos recetivos são grandes; os microssacádicos contrariam parcialmente a adaptação em condições normais."],"c_red":"Vermelho","c_green":"Verde","c_blue":"Azul","c_yellow":"Amarelo","a_start":"Olhar 20 s","a_ph":"Agora olha para o ponto","n_after":["Fixa durante 20 segundos e depois olha para o campo branco: vês a cor oposta, embora não exista no mundo.","Os cones adaptaram-se à cor fixada e respondem fracamente à luz branca; os complementares ficam mais ativos.","Teoria dos canais oponentes (Hering): a adaptação surge nos cones e nos canais oponentes seguintes; algumas pós-imagens persistem de olhos fechados, pelo que também têm uma componente cortical."],"l_truth":"Mostrar o alinhamento real","n_flash":["Olha para a cruz. O ponto branco que pisca parece ficar para trás em relação ao verde, embora estejam alinhados.","O cérebro compensa o atraso de ~100 ms extrapolando o movimento do objeto em movimento, mas não o do que pisca.","Explicações concorrentes: extrapolação (Nijhawan), diferenças de latência (Whitney), média temporal. O efeito mostra que a perceção do «presente» é uma estimativa."],"b_h":"Balanço: quanto vemos e quanto completamos","b_p":["A perceção visual está mais próxima de uma «alucinação controlada» (formulação de Anil Seth): uma hipótese contínua do cérebro, corrigida pelos sinais da retina.","No modelo de «codificação preditiva», o cérebro envia previsões para baixo e os erros de previsão sobem.","Formulações: Rao & Ballard, Friston. As camadas superiores prevêem a atividade das inferiores; propaga-se sobretudo o erro. O modelo continua em debate como explicação completa."],"b_c1":"Compressão: 120 → 1","b_c1n":"≈126 milhões de fotorrecetores → ≈1 milhão de fibras no nervo ótico. A retina comprime antes de transmitir.","b_c2":"Quanto do campo visual é realmente nítido?","b_ang":"Ângulo de visão nítida:","b_pct_t":"do campo visual (elipse ≈200°×135°) está em foco num dado momento. O resto é aproximado ou completado a partir do contexto.","s1":"da superfície da retina é a fóvea, mas uma parte muito grande do córtex visual primário é-lhe dedicada.","s2":"ponto cego: uma zona sem informação, preenchida automaticamente.","s3":"sacadas: a visão é suprimida durante elas, e não notas as «lacunas».","s4":"piscar de olhos: cada um interrompe a imagem ~0,1–0,15 s, e o cérebro «cola» a cena.","s5":"atraso retina → consciência; o cérebro prevê, por isso percebes uma pequena extrapolação.","s6":"é cerca desta parte das sinapses do núcleo geniculado lateral que vem diretamente da retina; o resto é feedback (valor indicativo).","b_concl":"<b>Conclusão.</b> A retina envia um esboço comprimido, com margens acentuadas e zonas em falta. O cérebro constrói a cena «clara e contínua» que vives. Quando falta a entrada, a construção continua sozinha: em algumas pessoas com perda grave de visão surge a síndrome de Charles Bonnet, com imagens vívidas inexistentes.","b_note":"Valores aproximados da literatura clássica (p. ex. Curcio e col., Jonas e col., Sherman & Guillery); variam entre indivíduos. Aplicação educativa, não uma ferramenta de diagnóstico.","q_h":"Teste","q_intro":"Dez perguntas sobre a retina e a perceção.","q_of":"Pergunta","q_next":"Seguinte","q_fin":"Ver o resultado","q_again":"Repetir o teste","q_score":"Pontuação","q_ok":"Correto!","q_no":"Errado.","q_m":["Ainda tens secções para reler.","Bem!","Excelente!"],"Q":[{"q"     if(i==2)for(let k=0;k<8;k++)s+=`<circle cx="${50+k*48}" cy="${cy+6}" r="6" fill="${l.c}" opacity=".85"/>`;
    if(i==3)for(let k=0;k<11;k++)s+=`<ellipse cx="${40+k*34}" cy="${cy+4}" rx="6" ry="11" fill="${l.c}" opacity=".85"/>`;
    if(i==4)for(let k=0;k<7;k++)s+=`<ellipse cx="${55+k*52}" cy="${cy+3}" rx="18" ry="5" fill="${l.c}" opacity=".85"/>`;
    if(i==5)for(let k=0;k<30;k++){const x=22+k*12.9;
      if(k%5==2)s+=`<path d="M${x-5},${l.y+96} L${x},${l.y+46} L${x+5},${l.y+96}z" fill="#ff7b72" opacity=".9"/><rect x="${x-3}" y="${l.y+8}" width="6" height="40" rx="2" fill="${l.c}" opacity=".5"/>`;

    s+=`<text x="16" y="${l.y+13}" font-size="12" fill="#fff" stroke="#0b0e14" stroke-width="3" paint-order="stroke">${names[i].n}</text></g>`;
