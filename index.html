<title>MIRAJ — retina &amp; halucinația controlată</title>
<style>
:root{--bg:#0b0e14;--panel:#141925;--panel2:#1b2232;--tx:#e6e9f0;--mut:#9aa4b8;--ac:#7cc4ff;--ac2:#ffb86b;--bd:#27304a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
header{padding:18px 16px 6px;max-width:900px;margin:0 auto}
h1{margin:0;font-size:1.7rem;letter-spacing:.2em;font-weight:700}
h1 span{color:var(--ac)}
.sub{color:var(--mut);margin:2px 0 8px;font-size:.95rem}
.ctl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:.85rem;color:var(--mut)}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:999px;overflow:hidden}
.seg button{background:var(--panel);color:var(--mut);border:0;padding:5px 12px;font-size:.85rem;cursor:pointer}
.seg button.on{background:var(--ac2);color:#1a1004;font-weight:600}
nav{position:sticky;top:0;z-index:5;background:rgba(11,14,20,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--bd);margin-top:8px}
nav div{max-width:900px;margin:0 auto;display:flex;gap:6px;padding:8px 12px;overflow-x:auto}
nav button{flex:0 0 auto;background:var(--panel);color:var(--mut);border:1px solid var(--bd);border-radius:999px;padding:7px 14px;font-size:.9rem;cursor:pointer}
nav button.on{background:var(--ac);color:#06121c;border-color:var(--ac);font-weight:600}
main{max-width:900px;margin:0 auto;padding:14px 12px 40px}
section{display:none}
section.on{display:block}
h2{font-size:1.25rem;margin:6px 0 4px}
p{margin:.5em 0}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.mut{color:var(--mut)}
.note{font-size:.88rem;color:var(--mut)}
canvas{width:100%;height:auto;display:block;border-radius:10px;background:#000;touch-action:none}
svg{width:100%;height:auto;display:block}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
.row label{font-size:.9rem;color:var(--mut)}
input[type=range]{flex:1;min-width:140px;accent-color:var(--ac)}
button.b,select{background:var(--panel2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px 14px;font-size:.9rem;cursor:pointer;font-family:inherit}
button.b.on{background:var(--ac);color:#06121c;border-color:var(--ac)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.layer{cursor:pointer}
.layer:hover rect.bg{opacity:.32}
#info{min-height:110px;border-left:4px solid var(--ac);padding-left:12px}

{n:'Ganglion cells',t:['The only cells that send the signal to the brain, as spikes.','They have centre–surround receptive fields: they respond to contrast, not absolute light.','Main types: M/parasol (motion, contrast), P/midget (fine detail, red–green), K (blue–yellow). ipRGCs with melanopsin regulate circadian rhythm and the pupil reflex.']},
{n:'Amacrine cells',t:['They help "understand" motion inside the eye itself.','Over 30 types; they detect motion direction and sudden changes by modulating the bipolar→ganglion signal.','E.g. starburst amacrine cells create direction selectivity in DS ganglion cells through asymmetric inhibition.']},
{n:'Bipolar cells',t:['They link photoreceptors to ganglion cells.','ON channels respond to light and OFF channels to darkness: the basis of contrast vision in both directions.','About 12 types; ON cells use mGluR6, OFF cells ionotropic glutamate receptors. Midget bipolars preserve foveal resolution (1 cone → 1 bipolar → 1 ganglion cell).']},
{n:'Horizontal cells',t:['They sharpen contrast by emphasising edges.','They connect neighbouring photoreceptors sideways and inhibit them (lateral inhibition): this explains Mach bands and, in part, the Hermann grid.','Horizontal→cone feedback tunes synaptic gain and contributes to colour constancy and light adaptation.']},
{n:'Photoreceptors',t:['They catch the light: ~120 M rods (night) and ~6 M cones (day and colour).','Rods work in dim light without colour; L, M, S cones give colour and cluster in the fovea. In light, photoreceptors hyperpolarise.','Phototransduction: photon → rhodopsin/opsin → transducin → PDE6 lowers cGMP → CNG channels close. A rod can respond to a single photon.']},
{n:'Pigment epithelium',t:['It absorbs stray light and feeds the photoreceptors.','It regenerates the visual pigment (retinal) used up by light.','It phagocytoses outer-segment tips daily; its dysfunction is implicated in age-related macular degeneration.']}],
f_h:'Gaze simulator',
f_p:['Move your finger or mouse over the image: that is where you look. Only the centre is sharp; the rest is blurred and less colourful, although in daily life you feel you see everything clearly.','The fovea (~2° of the visual field) has an enormous density of cones. Towards the periphery cones thin out and more photoreceptors converge on the same ganglion cell, so resolution drops fast.','Cone density falls from the order of 150,000–200,000/mm² in the fovea to under 10,000/mm² at ~10° eccentricity. Cortical magnification gives a small part of the retina a large share of V1.'],
f_rad:'Fovea radius',f_ill:'Show the illusion (all sharp)',
f_s1:'The fovea sees detail.',f_s2:'The periphery guesses; the brain fills in.',
f_words:'retina fovea cone rod ganglion nerve optic cortex visual saccade blink illusion context prediction',
o_h:'The blind spot',
o_p:['There is a "blind" zone in the eye, yet you do not see it: the brain fills it in.','Where the optic nerve leaves the eye there are no photoreceptors; a "hole" of about 5°×7° appears in the visual field.','It lies ~15° temporal to fixation, slightly below the horizontal. Filling-in involves visual-cortex activity, not merely ignoring the gap.'],
o_pos:'Mark position',o_dot:'Dot',o_gap:'Broken line',o_tex:'Texture',
o_how:'<b>How:</b> cover your <b>left</b> eye, look at the cross with your right eye without moving your gaze. Hold the screen at ~3–4 times the physical distance between cross and mark. Move the slider slowly: the mark vanishes. With the line, the gap "closes"; with the texture, stripes appear.',
i_h:'Illusions: retina and brain at work',
i_herm:'Hermann grid',i_mach:'Mach bands',i_trox:'Troxler',i_after:'Afterimage',i_flash:'Flash-lag',
l_hw:'Line width',
n_herm:['Grey dots appear at the white intersections, though nothing grey is there.','Classic explanation: lateral inhibition in centre–surround receptive fields. At intersections, the white surround inhibits the centre more than along a corridor.','The illusion persists with wavy lines, which contradicts a purely retinal account (Geier et al.); cortical models have been proposed.'],
l_mg:'Inhibition strength',mach_lbl:'white: real luminance · orange: centre–surround response',
n_mach:['Each band is a uniform grey, yet it looks lighter next to a darker neighbour and vice versa.','The retina exaggerates edges through centre–surround organisation. Below: real luminance (white) and simulated response (orange), with over- and undershoot at edges.','The model is a difference of Gaussians (σ centre=3 px, σ surround=9 px). Classic Mach bands arise at ramp transitions; the steps here only illustrate the filter response.'],
l_start:'Start',
n_trox:['Fixate the black dot: after a few seconds the surrounding blobs vanish.','The retina adapts to stable stimuli; neurons respond mainly to change, and the brain fills in with the background.','The effect is stronger in the periphery, where receptive fields are large; microsaccades partly counteract adaptation under normal conditions.'],
c_red:'Red',c_green:'Green',c_blue:'Blue',c_yellow:'Yellow',a_start:'Stare for 20 s',a_ph:'Now look at the dot',
n_after:['Stare for 20 seconds, then look at the white field: you see the opposite colour, though it does not exist in the world.','The cones adapted to the fixated colour and respond weakly to white light; the complementary ones stay relatively more active.','Opponent-process theory (Hering): adaptation occurs in cones and in downstream opponent channels; some afterimages persist with closed eyes, so a cortical component exists too.'],
l_truth:'Show true alignment',
n_flash:['Look at the cross. The flashed white dot seems to lag behind the green one, though they are aligned.','The brain compensates for the ~100 ms delay by extrapolating the position of the moving object, but not of the flashed one.','Competing explanations: extrapolation (Nijhawan), latency differences (Whitney), temporal averaging. The effect shows that perceiving "the present" is an estimate.'],
b_h:'Summary: how much we see and how much we fill in',
b_p:['Visual perception is closer to a "controlled hallucination" (Anil Seth\'s phrase): a continuous hypothesis by the brain, corrected by signals from the retina.','In the predictive-coding model, the brain sends predictions down and prediction errors travel up.','Formulations: Rao & Ballard, Friston. Higher layers predict lower-layer activity; mostly the error propagates. Whether it fully explains perception remains debated.'],

function renderRetina(){

  let s='<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#ffe9a8"/></marker></defs>';

    if(i==4)for(let k=0;k<7;k++)s+=`<ellipse cx="${55+k*52}" cy="${cy+3}" rx="18" ry="5" fill="${l.c}" opacity=".85"/>`;
    if(i==5)for(let k=0;k<30;k++){const x=22+k*12.9;
      if(k%5==2)s+=`<path d="M${x-5},${l.y+96} L${x},${l.y+46} L${x+5},${l.y+96}z" fill="#ff7b72" opacity=".9"/><rect x="${x-3}" y="${l.y+8}" width="6" height="40" rx="2" fill="${l.c}" opacity=".5"/>`;

    if(i==6)for(let k=0;k<20;k++)s+=`<circle cx="${22+k*20}" cy="${cy}" r="7" fill="${l.c}" opacity=".6"/>`;
    s+=`<text x="16" y="${l.y+13}" font-size="12" fill="#fff" stroke="#0b0e14" stroke-width="3" paint-order="stroke">${names[i].n}</text></g>`;

let fovDraw=()=>{};
function fovScene(){
  seed=11;const W=640,H=420;
  const sc=document.createElement('canvas');sc.width=W;sc.height=H;const s=sc.getContext('2d');
  let g=s.createLinearGradient(0,0,W,H);g.addColorStop(0,'#16254a');g.addColorStop(1,'#3a1d3f');s.fillStyle=g;s.fillRect(0,0,W,H);
  const cols=['#ff4d4d','#ffd23f','#3fd17a','#3fa7ff','#c76bff','#ff8a3f'];
  for(let i=0;i<26;i++){s.fillStyle=cols[i%6];s.beginPath();s.arc(30+rnd()*580,30+rnd()*360,8+rnd()*22,0,7);s.fill();}
  s.fillStyle='#fff';s.font='bold 34px sans-serif';s.fillText(tt('f_s1'),150,70);
  s.font='20px sans-serif';s.fillText(tt('f_s2'),100,105);
  s.font='13px monospace';
  const words=tt('f_words').split(' ');
  for(let r=0;r<9;r++){let line='';for(let k=0;k<8;k++)line+=words[(r*3+k)%words.length]+' ';s.fillStyle='#eaf0ff';s.fillText(line,60,200+r*17);}
  s.fillStyle='#fff';s.font='bold 22px monospace';
  for(let r=0;r<3;r++)for(let k=0;k<10;k++)s.fillText('AEKMRSTXZH'[(r*7+k*3)%10],440+k*18,230+r*30);
  s.strokeStyle='#fff';s.lineWidth=2;for(let i=0;i<14;i++){s.beginPath();s.moveTo(40+i*8,340);s.lineTo(40+i*8,400);s.stroke();}
  s.fillStyle='#ffd23f';s.beginPath();s.arc(520,350,32,0,7);s.fill();s.fillStyle='#000';s.fillRect(508,340,6,6);s.fillRect(526,340,6,6);s.fillRect(508,358,24,4);
  function small(f,gray){const t=document.createElement('canvas');t.width=Math.round(W/f);t.height=Math.round(H/f);const x=t.getContext('2d');x.imageSmoothingEnabled=true;x.drawImage(sc,0,0,t.width,t.height);
    const d=x.getImageData(0,0,t.width,t.height),p=d.data;for(let i=0;i<p.length;i+=4){const y=.3*p[i]+.59*p[i+1]+.11*p[i+2];p[i]=p[i]*(1-gray)+y*gray;p[i+1]=p[i+1]*(1-gray)+y*gray;p[i+2]=p[i+2]*(1-gray)+y*gray}
    x.putImageData(d,0,0);return t}
  const mid=small(4,.35),low=small(11,.75),c=$('#cf'),ctx=c.getContext('2d');
  const tc=document.createElement('canvas');tc.width=W;tc.height=H;const t=tc.getContext('2d');
  function masked(src,x,y,r0,r1){t.globalCompositeOperation='source-over';t.clearRect(0,0,W,H);t.imageSmoothingEnabled=true;t.drawImage(src,0,0,W,H);
    t.globalCompositeOperation='destination-in';const gr=t.createRadialGradient(x,y,r0,x,y,r1);gr.addColorStop(0,'rgba(0,0,0,1)');gr.addColorStop(1,'rgba(0,0,0,0)');t.fillStyle=gr;t.fillRect(0,0,W,H);ctx.drawImage(tc,0,0)}
  fovDraw=()=>{
    const R=+$('#fr').value;ctx.imageSmoothingEnabled=true;
    if($('#fill').checked){ctx.drawImage(sc,0,0);return}
    ctx.drawImage(low,0,0,W,H);
    masked(mid,fovPos.x,fovPos.y,R*1.6,R*3.4);
    masked(sc,fovPos.x,fovPos.y,R*.55,R);
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(fovPos.x,fovPos.y,3,0,7);ctx.stroke();
  };
  fovDraw();
}
const fovPos={x:320,y:210};
function initFovea(){
  const c=$('#cf');
  function mv(e){const r=c.getBoundingClientRect();fovPos.x=(e.clientX-r.left)*640/r.width;fovPos.y=(e.clientY-r.top)*420/r.height;fovDraw()}
  c.addEventListener('pointermove',mv);c.addEventListener('pointerdown',mv);

function initOrb(){
  const c=$('#cb'),x=c.getContext('2d'),W=720,H=260,Y=130;let mode='dot';
  function draw(){
    const px=+$('#bx').value;x.fillStyle='#10141f';x.fillRect(0,0,W,H);
    if(mode=='tex'){x.save();x.strokeStyle='#5a76b8';x.lineWidth=5;for(let i=-H;i<W;i+=16){x.beginPath();x.moveTo(i,0);x.lineTo(i+H,H);x.stroke()}
      x.restore();x.fillStyle='#10141f';x.beginPath();x.arc(px,Y,30,0,7);x.fill();}
    if(mode=='gap'){x.strokeStyle='#ff8a65';x.lineWidth=9;x.beginPath();x.moveTo(40,Y);x.lineTo(px-30,Y);x.moveTo(px+30,Y);x.lineTo(W-20,Y);x.stroke();}
    if(mode=='dot'){x.fillStyle='#ff4d4d';x.beginPath();x.arc(px,Y,14,0,7);x.fill()}
    x.strokeStyle='#fff';x.lineWidth=4;x.beginPath();x.moveTo(75,Y-18);x.lineTo(75,Y+18);x.moveTo(57,Y);x.lineTo(93,Y);x.stroke();

  $$('#bmode button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;$$('#bmode button').forEach(k=>k.classList.toggle('on',k===b));draw()});

}

let flashRAF=0,flashOn=false,machFn=null;
function initIll(){
  $$('#imode button').forEach(b=>b.onclick=()=>{
    $$('#imode button').forEach(k=>k.classList.toggle('on',k===b));
    $$('.ill').forEach(d=>d.style.display=d.id==='i-'+b.dataset.i?'block':'none');
    flashOn=b.dataset.i==='flash';if(flashOn&&!flashRAF)flashLoop();
  });
  const h=$('#ch').getContext('2d');
  function herm(){const w=+$('#hw').value,sq=70,W=480;h.fillStyle='#fff';h.fillRect(0,0,W,W);h.fillStyle='#000';
    for(let i=0;i*(sq+w)<W+sq;i++)for(let j=0;j*(sq+w)<W+sq;j++)h.fillRect(w/2+i*(sq+w),w/2+j*(sq+w),sq,sq)}
  $('#hw').oninput=herm;herm();
  const m=$('#cm').getContext('2d');
  machFn=function(){const W=480,H=320,n=8,sw=W/n;m.fillStyle='#000';m.fillRect(0,0,W,H);
    const lum=i=>(40+i*25)/255;
    for(let i=0;i<n;i++){const v=Math.round(lum(i)*255);m.fillStyle=`rgb(${v},${v},${v})`;m.fillRect(i*sw,0,sw,120)}
    const L=new Float32Array(W);for(let p=0;p<W;p++)L[p]=lum(Math.min(n-1,Math.floor(p/sw)));
    const R=30,gc=3,gs=9;let kc=[],ks=[],sc=0,ss=0;
    for(let k=-R;k<=R;k++){const a=Math.exp(-k*k/(2*gc*gc)),b=Math.exp(-k*k/(2*gs*gs));kc.push(a);ks.push(b);sc+=a;ss+=b}
    const gain=+$('#mg').value/10,base=300,sc2=130;
    m.strokeStyle='#223';m.lineWidth=1;m.strokeRect(.5,150.5,W-1,150);
    function plot(f,col){m.strokeStyle=col;m.lineWidth=2;m.beginPath();for(let p=0;p<W;p++){const y=base-f(p)*sc2;p?m.lineTo(p,y):m.moveTo(p,y)}m.stroke()}
    const resp=p=>{let c=0,s=0;for(let k=-R;k<=R;k++){const q=Math.min(W-1,Math.max(0,p+k)),v=L[q];c+=v*kc[k+R];s+=v*ks[k+R]}return c/sc-s/ss};
    plot(p=>L[p],'#ffffff');plot(p=>L[p]+gain*resp(p),'#ffb86b');
    m.fillStyle='#9aa4b8';m.font='12px sans-serif';m.fillText(tt('mach_lbl'),8,146);
  };
  $('#mg').oninput=machFn;machFn();
  const tx=$('#ct').getContext('2d');let tint=0;
  function trox(){tx.fillStyle='#8a8a8a';tx.fillRect(0,0,480,360);
    for(let i=0;i<7;i++){const a=i/7*6.283,x=240+Math.cos(a)*135,y=180+Math.sin(a)*115,g=tx.createRadialGradient(x,y,0,x,y,48);g.addColorStop(0,'rgba(110,170,215,.55)');g.addColorStop(1,'rgba(110,170,215,0)');tx.fillStyle=g;tx.fillRect(x-50,y-50,100,100)}
    tx.fillStyle='#000';tx.beginPath();tx.arc(240,180,5,0,7);tx.fill()}
  trox();
  $('#tstart').onclick=()=>{trox();clearInterval(tint);let t=0;$('#ttime').textContent='0 s';tint=setInterval(()=>{t++;$('#ttime').textContent=t+' s';if(t>=25)clearInterval(tint)},1000)};
  let ai=0;
  $('#astart').onclick=()=>{
    clearInterval(ai);const st=$('#stage'),sh=$('#shape');st.style.background='#777';sh.style.display='block';sh.style.background=$('#acol').value;
    let t=20;$('#atime').textContent=t+' s';
    ai=setInterval(()=>{t--;$('#atime').textContent=t+' s';if(t<=0){clearInterval(ai);sh.style.display='none';st.style.background='#fff';$('#atime').textContent=tt('a_ph')}},1000)};
  $('#acol').onchange=()=>{clearInterval(ai);$('#shape').style.display='block';$('#stage').style.background='#777';$('#shape').style.background=$('#acol').value;$('#atime').textContent=''};
  $('#shape').style.background=$('#acol').value;
}
function flashLoop(){
  const x=$('#cl').getContext('2d'),t0=performance.now();
  (function f(now){
    if(!flashOn){flashRAF=0;return}
    const t=(now-t0)/1000,ang=t*2.0,cyc=t%1.6,show=cyc<.09,frozen=cyc<.5&&$('#ltruth').checked;
    x.fillStyle='#10141f';x.fillRect(0,0,480,360);
    x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();x.moveTo(230,180);x.lineTo(250,180);x.moveTo(240,170);x.lineTo(240,190);x.stroke();
    x.fillStyle='#3fd17a';x.beginPath();x.arc(240+Math.cos(ang)*140,180+Math.sin(ang)*140,10,0,7);x.fill();
    if(show){x.fillStyle='#fff';x.beginPath();x.arc(240+Math.cos(ang)*85,180+Math.sin(ang)*85,10,0,7);x.fill()}
    if(frozen){const a=Math.floor(t/1.6)*1.6*2.0;x.strokeStyle='rgba(255,184,107,.8)';x.lineWidth=1.5;x.beginPath();x.moveTo(240+Math.cos(a)*60,180+Math.sin(a)*60);x.lineTo(240+Math.cos(a)*160,180+Math.sin(a)*160);x.stroke()}
    flashRAF=requestAnimationFrame(f);
  })(performance.now());
}

/* ---------- BILANT ---------- */
function upBilant(){const a=+$('#ang').value;$('#aval').textContent=a;
  const p=Math.PI*(a/2)*(a/2)/(Math.PI*100*67.5)*100;let s=p.toFixed(3);if(lang==='ro')s=s.replace('.',',');$('#pct').textContent='≈ '+s+' %'}
function initBilant(){
  let d='';for(let i=0;i<120;i++)d+=`<i class="${i==0?'g':''}"></i>`;$('#dots').innerHTML=d;
  $('#ang').oninput=upBilant;upBilant();
}

/* ---------- QUIZ ---------- */
const Qs={i:0,s:0,ans:null,done:false};
function initQuiz(){renderQuiz()}
function renderQuiz(){
  const Q=tt('Q'),box=$('#quiz');
  if(Qs.done){
    const f=Qs.s/Q.length,m=tt('q_m')[f<.5?0:(f<.85?1:2)];
    box.innerHTML=`<h3 style="margin-top:0">${tt('q_score')}: ${Qs.s} / ${Q.length}</h3><p>${m}</p><button class="b" id="qre">${tt('q_again')}</button>`;
    $('#qre').onclick=()=>{Qs.i=0;Qs.s=0;Qs.ans=null;Qs.done=false;renderQuiz()};return;
  }
  const q=Q[Qs.i];
  let h=`<div class="prog"><i style="width:${(Qs.i/Q.length)*100}%"></i></div><p class="note">${tt('q_of')} ${Qs.i+1} / ${Q.length}</p><p><b>${q.q}</b></p>`;
  q.o.forEach((o,k)=>{
    let cls='opt';if(Qs.ans!==null){if(k===q.a)cls+=' ok';else if(k===Qs.ans)cls+=' no'}
    h+=`<button class="${cls}" data-k2="${k}" ${Qs.ans!==null?'disabled':''}>${o}</button>`;
  });
  if(Qs.ans!==null){
    h+=`<p><b>${Qs.ans===q.a?tt('q_ok'):tt('q_no')}</b> ${q.e}</p><button class="b" id="qn">${Qs.i===Q.length-1?tt('q_fin'):tt('q_next')}</button>`;
  }
  box.innerHTML=h;
  $$('#quiz .opt').forEach(b=>b.onclick=()=>{Qs.ans=+b.dataset.k2;if(Qs.ans===q.a)Qs.s++;renderQuiz()});
  const n=$('#qn');if(n)n.onclick=()=>{Qs.ans=null;if(Qs.i===Q.length-1)Qs.done=true;else Qs.i++;renderQuiz()};
}

apply();inited.retina=1;
</script>
